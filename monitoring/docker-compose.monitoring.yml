# ─────────────────────────────────────────────────────────────────────────────
# DrinkIndex Monitoring Stack
#   - Prometheus  : 메트릭 수집/저장
#   - Grafana     : 대시보드
#   - Alertmanager: 알림 라우팅 (Slack)
#   - Exporters   : node, mariadb, redis
#
# 운영 호스트에서 base compose 와 함께 기동:
#   docker compose --env-file .env.prod \
#     -f docker-compose.yml -f docker-compose.prod.yml \
#     -f monitoring/docker-compose.monitoring.yml up -d
#
# 모든 모니터링 서비스는 `drinkindex` 네트워크 공유 → API actuator(:8081) 접근 가능.
# 외부 노출은 grafana 만 (127.0.0.1:3000 — SSH 터널/Cloudflare Zero Trust 권장).
# ─────────────────────────────────────────────────────────────────────────────

services:
  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: di-prod-prometheus
    user: "65534:65534"   # nobody
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prom_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
    networks:
      - drinkindex
    restart: unless-stopped
    logging:
      driver: "json-file"
      options: { max-size: "20m", max-file: "3" }

  grafana:
    image: grafana/grafana:11.3.0
    container_name: di-prod-grafana
    user: "472:472"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_ALLOW_ORG_CREATE: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      # 127.0.0.1 만 바인딩 — Cloudflare Tunnel 또는 SSH 터널로 접근
      - "127.0.0.1:3000:3000"
    networks:
      - drinkindex
    depends_on:
      - prometheus
    restart: unless-stopped
    logging:
      driver: "json-file"
      options: { max-size: "20m", max-file: "3" }

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: di-prod-alertmanager
    user: "65534:65534"
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    environment:
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL}
      SLACK_CHANNEL: ${SLACK_CHANNEL:-#drinkindex-alerts}
    networks:
      - drinkindex
    restart: unless-stopped
    logging:
      driver: "json-file"
      options: { max-size: "10m", max-file: "3" }

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: di-prod-node-exporter
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    networks:
      - drinkindex
    restart: unless-stopped

  mariadb-exporter:
    image: prom/mysqld-exporter:v0.15.1
    container_name: di-prod-mariadb-exporter
    command:
      - --mysqld.username=${DB_USERNAME}:${DB_PASSWORD}
      - --mysqld.address=host.docker.internal:3306
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - drinkindex
    depends_on:
      - prometheus
    restart: unless-stopped

  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    container_name: di-prod-redis-exporter
    environment:
      REDIS_ADDR: redis://host.docker.internal:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - drinkindex
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  prom_data:
  grafana_data:
  alertmanager_data:

networks:
  drinkindex:
    external: true
    name: drink-index_drinkindex
