# ─────────────────────────────────────────────────────────────────────────────
# Prometheus 설정 — DrinkIndex
# ─────────────────────────────────────────────────────────────────────────────
global:
  scrape_interval:     30s
  evaluation_interval: 30s
  external_labels:
    monitor: drinkindex
    env: prod

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # ── DrinkIndex API (Spring Boot Actuator / Micrometer) ──
  - job_name: drinkindex-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['api:8081']
        labels:
          service: api

  # ── 호스트 메트릭 ──
  - job_name: node-exporter
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          service: node

  # ── MariaDB ──
  - job_name: mariadb
    static_configs:
      - targets: ['mariadb-exporter:9104']
        labels:
          service: mariadb

  # ── Redis ──
  - job_name: redis
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          service: redis

  # ── Prometheus 자체 ──
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
