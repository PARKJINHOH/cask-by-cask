# ─────────────────────────────────────────────────────────────────────────────
# CaskByCask Alert Rules — Prometheus
# ─────────────────────────────────────────────────────────────────────────────
groups:
  - name: caskbycask-availability
    interval: 30s
    rules:
      - alert: ApiDown
        expr: up{job="caskbycask-api"} == 0
        for: 2m
        labels:
          severity: critical
          service: api
        annotations:
          summary: "CaskByCask API 다운"
          description: "API 컨테이너가 2분 이상 응답하지 않습니다."

      - alert: MariaDBDown
        expr: up{job="mariadb"} == 0
        for: 2m
        labels:
          severity: critical
          service: mariadb
        annotations:
          summary: "MariaDB 다운"
          description: "MariaDB exporter 가 2분 이상 응답하지 않습니다."

      - alert: RedisDown
        expr: up{job="redis"} == 0
        for: 2m
        labels:
          severity: critical
          service: redis
        annotations:
          summary: "Redis 다운"
          description: "Redis exporter 가 2분 이상 응답하지 않습니다."

  - name: caskbycask-performance
    interval: 30s
    rules:
      - alert: ApiHighErrorRate
        expr: |
          sum(rate(http_server_requests_seconds_count{job="caskbycask-api",status=~"5.."}[5m]))
            /
          sum(rate(http_server_requests_seconds_count{job="caskbycask-api"}[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
          service: api
        annotations:
          summary: "API 5xx 에러 비율 5% 초과"
          description: "최근 5분 5xx 비율이 {{ $value | humanizePercentage }} 입니다."

      - alert: ApiHighLatency
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(http_server_requests_seconds_bucket{job="caskbycask-api"}[5m]))
          ) > 2
        for: 5m
        labels:
          severity: warning
          service: api
        annotations:
          summary: "API P95 응답 지연 2초 초과"
          description: "P95 latency = {{ $value }}s"

      - alert: JvmMemoryPressure
        expr: |
          (sum by (instance) (jvm_memory_used_bytes{job="caskbycask-api",area="heap"})
           / sum by (instance) (jvm_memory_max_bytes{job="caskbycask-api",area="heap"})) > 0.90
        for: 10m
        labels:
          severity: warning
          service: api
        annotations:
          summary: "JVM heap 사용률 90% 초과"
          description: "heap 사용률 = {{ $value | humanizePercentage }}"

  - name: caskbycask-host
    interval: 30s
    rules:
      - alert: HostDiskFilling
        expr: |
          (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) < 0.10
        for: 10m
        labels:
          severity: warning
          service: host
        annotations:
          summary: "호스트 디스크 여유 10% 미만"
          description: "남은 공간: {{ $value | humanizePercentage }}"

      - alert: HostHighLoad
        expr: node_load5 > 4
        for: 10m
        labels:
          severity: warning
          service: host
        annotations:
          summary: "호스트 load5 4 초과"

      - alert: HostHighMemory
        expr: |
          (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) > 0.90
        for: 10m
        labels:
          severity: warning
          service: host
        annotations:
          summary: "호스트 메모리 사용률 90% 초과"
