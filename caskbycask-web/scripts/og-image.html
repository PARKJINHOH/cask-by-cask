<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1200" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap');

    body {
      width: 1200px;
      height: 630px;
      font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif;
      background: linear-gradient(135deg, #1c1008 0%, #3d1f00 40%, #78350f 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    .bg-circle {
      position: absolute;
      border-radius: 50%;
      background: rgba(251, 191, 36, 0.06);
    }
    .bg-circle-1 { width: 600px; height: 600px; top: -200px; right: -100px; }
    .bg-circle-2 { width: 400px; height: 400px; bottom: -150px; left: -80px; }

    .content {
      text-align: center;
      color: white;
      position: relative;
      z-index: 1;
      padding: 0 80px;
    }

    .badge {
      display: inline-block;
      background: rgba(251, 191, 36, 0.2);
      border: 1px solid rgba(251, 191, 36, 0.5);
      color: #fbbf24;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.15em;
      padding: 6px 18px;
      border-radius: 999px;
      margin-bottom: 28px;
      text-transform: uppercase;
    }

    .logo {
      font-size: 72px;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: -0.02em;
      line-height: 1;
      margin-bottom: 20px;
    }

    .logo span { color: #fbbf24; }

    .tagline {
      font-size: 24px;
      font-weight: 400;
      color: rgba(255,255,255,0.75);
      letter-spacing: 0.02em;
      margin-bottom: 40px;
    }

    .icons { font-size: 40px; letter-spacing: 12px; }

    .url {
      position: absolute;
      bottom: 40px;
      right: 60px;
      font-size: 18px;
      color: rgba(255,255,255,0.4);
      font-weight: 400;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>
  <div class="bg-circle bg-circle-1"></div>
  <div class="bg-circle bg-circle-2"></div>

  <div class="content">
    <div class="badge">주류 리뷰 커뮤니티</div>
    <div class="logo">Drink<span>Index</span></div>
    <div class="tagline">위스키 · 와인 · 꼬냑 · 럼 · 데킬라</div>
    <div class="icons">🥃 🍷 🍾</div>
  </div>

  <div class="url">caskbycask.pinner.dev</div>
</body>
</html>
