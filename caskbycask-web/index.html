<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- 기본 SEO fallback (JS 미실행 소셜 스크래퍼용).
         <title> 은 SeoMeta(React 19)가 페이지별로 <head>에 주입하므로 여기서 정의하지 않는다.
         (정적 <title> 을 두면 React 가 덮어쓰지 않고 append 해서 title 이 2개가 됨) -->
    <meta name="description" content="CaskByCask 는 위스키, 와인, 꼬냑, 데킬라, 럼 등 다양한 주류 정보를 탐색하고 리뷰를 공유하는 커뮤니티입니다. 증류소·와이너리별 정보와 사용자 평점을 만나보세요." />
    <meta name="keywords" content="위스키, 와인, 꼬냑, 럼, 데킬라, 주류 리뷰, 증류소, 와이너리, caskbycask, 캐스크바이캐스크, 캐바캐" />
    <meta name="author" content="CaskByCask" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://caskbycask.net/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CaskByCask" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:title" content="CaskByCask — 위스키 · 와인 · 꼬냑 주류 리뷰 커뮤니티" />
    <meta property="og:description" content="다양한 주류 정보를 탐색하고 리뷰를 공유하는 커뮤니티." />
    <meta property="og:url" content="https://caskbycask.net/" />
    <meta property="og:image" content="https://caskbycask.net/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CaskByCask — 위스키 · 와인 · 꼬냑 주류 리뷰 커뮤니티" />
    <meta name="twitter:description" content="다양한 주류 정보를 탐색하고 리뷰를 공유하는 커뮤니티." />
    <meta name="twitter:image" content="https://caskbycask.net/og-image.png" />

    <!-- 언어 대체 — 페이지별 hreflang 은 SeoMeta 가 동적으로 주입.
         메인 fallback (정적 HTML 만 보는 봇 대비) 만 유지. -->
    <link rel="alternate" hreflang="x-default" href="https://caskbycask.net/" />

    <!-- Theme -->
    <meta name="theme-color" content="#d97706" />

    <!-- 정적 자원: favicon (favicon_io 슬림 세트) -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="msapplication-TileColor" content="#d97706" />
    <!-- 폰트 CDN preconnect — FCP/LCP 단축 -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.css" />

    <!-- JSON-LD: WebSite + Organization (전역) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "@id": "https://caskbycask.net/#website",
          "url": "https://caskbycask.net/",
          "name": "CaskByCask",
          "alternateName": ["캐스크바이캐스크", "캐바캐"],
          "description": "위스키 · 와인 · 꼬냑 주류 리뷰 커뮤니티",
          "inLanguage": "ko-KR",
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://caskbycask.net/spirits?q={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        },
        {
          "@type": "Organization",
          "@id": "https://caskbycask.net/#organization",
          "name": "CaskByCask",
          "alternateName": ["캐스크바이캐스크", "캐바캐"],
          "url": "https://caskbycask.net/",
          "logo": "https://caskbycask.net/logo.png"
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
