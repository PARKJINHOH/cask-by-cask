# ─────────────────────────────────────────────────────────────────────────────
# DrinkIndex — base compose (공통 정의)
#
# DB/Redis 는 호스트(Oracle Cloud)에 설치된 것을 그대로 사용 — 컨테이너로 띄우지 않음.
# api 컨테이너에서 호스트 서비스로 붙기 위해 extra_hosts 로 host.docker.internal 매핑.
#   - 같은 서버에 DB 가 있으면: DEV_DB_HOST=host.docker.internal
#   - 다른 서버에 DB 가 있으면: DEV_DB_HOST=<DB 서버 IP/호스트명>
#
# 환경별 override 파일과 함께 사용:
#   dev  : docker compose --env-file .env.dev  -f docker-compose.yml -f docker-compose.dev.yml  up -d --build
#   prod : docker compose --env-file .env.prod -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# 또는 deploy/deploy.sh dev|prod 스크립트 사용.
# ─────────────────────────────────────────────────────────────────────────────

# 프로젝트명 고정 — 클론 디렉터리명(drink-index 등)에 상관없이 항상 동일한
# 네트워크/볼륨 이름을 갖도록 함 (network: drinkindex_drinkindex, volume: drinkindex_uploads ...)
name: drinkindex

services:
  api:
    build:
      context: ./drinkindex-api
    image: drinkindex/api:${IMAGE_TAG:-latest}
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      # DB (호스트 MariaDB)
      DEV_DB_HOST: ${DEV_DB_HOST:-host.docker.internal}
      PROD_DB_HOST: ${PROD_DB_HOST:-host.docker.internal}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      # Redis (호스트 Redis)
      DEV_REDIS_HOST: ${DEV_REDIS_HOST:-host.docker.internal}
      PROD_REDIS_HOST: ${PROD_REDIS_HOST:-host.docker.internal}
      DEV_REDIS_PASSWORD: ${REDIS_PASSWORD}
      PROD_REDIS_PASSWORD: ${REDIS_PASSWORD}
      # JWT
      JWT_SECRET: ${JWT_SECRET}
      JWT_SECRET_PREVIOUS: ${JWT_SECRET_PREVIOUS:-}
      # Admin / Email
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      EMAIL_FROM: ${EMAIL_FROM}
      INQUIRY_EMAIL: ${INQUIRY_EMAIL}
      GMAIL_USERNAME: ${GMAIL_USERNAME}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD}
      # Storage / Logs
      UPLOAD_PATH: /var/drinkindex/uploads
      LOG_PATH: /var/drinkindex/logs
      # Actuator (docker network 내부에서 prometheus 접근)
      MANAGEMENT_HOST: 0.0.0.0
    volumes:
      - uploads:/var/drinkindex/uploads
      - logs:/var/drinkindex/logs
    extra_hosts:
      # 호스트의 MariaDB/Redis 접속용. Linux 에서는 명시가 필요 (Docker Desktop 은 자동).
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - drinkindex

  web:
    build:
      context: ./drinkindex-web
    image: drinkindex/web:${IMAGE_TAG:-latest}
    environment:
      API_HOST: api
      API_PORT: 8080
      MAINTENANCE_MODE: ${MAINTENANCE_MODE:-off}
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - drinkindex

volumes:
  uploads:
  logs:

networks:
  drinkindex:
    driver: bridge
