name: Deploy (manual)

# 수동 배포 전용 — Actions 탭에서 "Run workflow" 클릭으로 실행.
# API 는 x64 러너에서, 네이티브 모듈을 포함할 수 있는 Next.js standalone 은
# 운영 서버와 같은 Linux ARM64 러너에서 Web과 crawler를 검증·빌드하고 산출물만 서버로 전송한다.
#
# 필요한 배포용 Repository Secrets (앱 런타임 환경변수 아님):
#   SSH_HOST   서버 공인 IP (또는 Cloudflare 미프록시 직결 주소)
#   SSH_USER   배포 유저 (예: ubuntu)
#   SSH_KEY    배포용 SSH 개인키 (전체 내용)
#   SSH_PORT   (선택) SSH 포트, 미설정 시 22
#   SLACK_WEBHOOK_URL  (선택) 배포 결과 Slack 알림용. 서버 api.env 와 같은 웹훅 URL 을
#                      repo Secret 으로도 등록. 미설정 시 알림만 조용히 건너뜀.

on:
  workflow_dispatch:
    inputs:
      target:
        description: "배포 대상 (both=FE+BE / api / web / crawler / all=전체)"
        type: choice
        default: both
        options:
          - both
          - api
          - web
          - crawler
          - all
      ref:
        description: "배포할 브랜치/태그 (기본: main)"
        required: false
        default: main

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve-ref:
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Freeze deployment commit
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build-api:
    needs: resolve-ref
    if: ${{ inputs.target == 'both' || inputs.target == 'api' || inputs.target == 'all' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.resolve-ref.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
      - name: Test and build bootJar
        working-directory: caskbycask-api
        run: |
          chmod +x gradlew
          ./gradlew clean test bootJar --no-daemon
      - name: Pick jar
        working-directory: caskbycask-api
        run: |
          JAR=$(ls -t build/libs/*.jar | grep -v plain | head -1)
          echo "Picked: $JAR"
          cp "$JAR" build/libs/app.jar
      - name: Upload to Oracle Object Storage & Cleanup
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.OCI_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.OCI_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: "ap-chuncheon-1"
          AWS_REQUEST_CHECKSUM_CALCULATION: "when_required"
          AWS_RESPONSE_CHECKSUM_VALIDATION: "when_required"
          ENDPOINT: "https://${{ secrets.OCI_NAMESPACE }}.compat.objectstorage.ap-chuncheon-1.oraclecloud.com"
          BUCKET: ${{ secrets.OCI_BUCKET }}
        run: |
          # AWS CLI S3 설정 (Multipart 업로드 차단, v4 서명 및 경로 스타일 강제, 페이로드 서명 비활성화)
          aws configure set default.s3.multipart_threshold 512MB
          aws configure set default.s3.multipart_chunksize 512MB
          aws configure set default.s3.signature_version s3v4
          aws configure set default.s3.addressing_style path
          aws configure set default.s3.payload_signing false
          
          # 1. 파일 업로드
          aws s3 cp caskbycask-api/build/libs/app.jar "s3://$BUCKET/api/app-${{ github.run_id }}-${{ github.run_attempt }}.jar" --endpoint-url "$ENDPOINT" --region ap-chuncheon-1
          
          # 2. 최신 3개만 유지하고 이전 아티팩트 정리
          KEYS=$(aws s3api list-objects-v2 --bucket "$BUCKET" --prefix "api/" --endpoint-url "$ENDPOINT" --region ap-chuncheon-1 --query "sort_by(Contents, &LastModified)[].Key" --output text 2>/dev/null || echo "")
          if [ -n "$KEYS" ] && [ "$KEYS" != "None" ]; then
            read -ra key_array <<< "$KEYS"
            total=${#key_array[@]}
            if [ "$total" -gt 3 ]; then
              delete_count=$((total - 3))
              for ((i=0; i<delete_count; i++)); do
                key="${key_array[i]}"
                echo "Deleting old API artifact: $key"
                aws s3api delete-object --bucket "$BUCKET" --key "$key" --endpoint-url "$ENDPOINT" --region ap-chuncheon-1
              done
            fi
          fi

  build-web:
    needs: resolve-ref
    if: ${{ inputs.target == 'both' || inputs.target == 'web' || inputs.target == 'all' }}
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.resolve-ref.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: caskbycask-web/package-lock.json
      - name: Install deps
        working-directory: caskbycask-web
        run: npm ci
      - name: Test session cache isolation
        working-directory: caskbycask-web
        run: npm run test:auth-cache
      - name: Type check
        working-directory: caskbycask-web
        run: npm run typecheck
      - name: Build (Next.js Standalone Build)
        working-directory: caskbycask-web
        run: |
          npm run build
      - name: Copy static & public to standalone
        working-directory: caskbycask-web
        run: |
          mkdir -p .next/standalone/.next/static
          cp -r .next/static/. .next/standalone/.next/static/
          if [ -d "public" ]; then
            cp -r public .next/standalone/
          fi
      - name: Compress & Upload to Oracle Object Storage & Cleanup
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.OCI_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.OCI_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: "ap-chuncheon-1"
          AWS_REQUEST_CHECKSUM_CALCULATION: "when_required"
          AWS_RESPONSE_CHECKSUM_VALIDATION: "when_required"
          ENDPOINT: "https://${{ secrets.OCI_NAMESPACE }}.compat.objectstorage.ap-chuncheon-1.oraclecloud.com"
          BUCKET: ${{ secrets.OCI_BUCKET }}
        run: |
          # AWS CLI S3 설정 (Multipart 업로드 차단, v4 서명 및 경로 스타일 강제, 페이로드 서명 비활성화)
          aws configure set default.s3.multipart_threshold 512MB
          aws configure set default.s3.multipart_chunksize 512MB
          aws configure set default.s3.signature_version s3v4
          aws configure set default.s3.addressing_style path
          aws configure set default.s3.payload_signing false
          
          # 1. tar.gz로 압축
          tar -czf web-dist.tar.gz -C caskbycask-web/.next/standalone .
          
          # 2. 파일 업로드
          aws s3 cp web-dist.tar.gz "s3://$BUCKET/web/web-dist-${{ github.run_id }}-${{ github.run_attempt }}.tar.gz" --endpoint-url "$ENDPOINT" --region ap-chuncheon-1
          
          # 3. 최신 3개만 유지하고 이전 아티팩트 정리
          KEYS=$(aws s3api list-objects-v2 --bucket "$BUCKET" --prefix "web/" --endpoint-url "$ENDPOINT" --region ap-chuncheon-1 --query "sort_by(Contents, &LastModified)[].Key" --output text 2>/dev/null || echo "")
          if [ -n "$KEYS" ] && [ "$KEYS" != "None" ]; then
            read -ra key_array <<< "$KEYS"
            total=${#key_array[@]}
            if [ "$total" -gt 3 ]; then
              delete_count=$((total - 3))
              for ((i=0; i<delete_count; i++)); do
                key="${key_array[i]}"
                echo "Deleting old WEB artifact: $key"
                aws s3api delete-object --bucket "$BUCKET" --key "$key" --endpoint-url "$ENDPOINT" --region ap-chuncheon-1
              done
            fi
          fi

  test-crawler:
    needs: resolve-ref
    if: ${{ inputs.target == 'crawler' || inputs.target == 'all' }}
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.resolve-ref.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: caskbycask-crawler/requirements.lock
      - name: Verify locked dependencies
        working-directory: caskbycask-crawler
        run: |
          python scripts/verify_requirements_lock.py
          python -m pip install --require-hashes --only-binary=:all: -r requirements.lock
      - name: Compile and test crawler
        working-directory: caskbycask-crawler
        run: |
          python -m compileall -q -x '/\.venv/' .
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Test crawler release wrappers
        run: bash deploy/tests/test-crawler-runtime.sh

  deploy:
    needs: [resolve-ref, build-api, build-web, test-crawler]
    # 빌드 중 하나가 스킵돼도(=대상 아님) deploy 는 돌아야 한다.
    # needs 가 skipped 면 기본적으로 의존 잡도 skipped 되므로 status 함수로 강제 실행.
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.resolve-ref.outputs.sha }}
          persist-credentials: false
      - name: Validate operations scripts
        run: |
          bash -n deploy/server/*.sh
          bash deploy/tests/test-db-query-candidates.sh
          bash deploy/tests/test-backup-db.sh
          bash deploy/tests/test-offsite-backup.sh
          bash deploy/tests/test-restore-offsite-drill.sh
      # 아티팩트 다운로드 — 해당 빌드가 실제로 성공했을 때만
      - name: Download api jar
        if: ${{ needs.build-api.result == 'success' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.OCI_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.OCI_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: "ap-chuncheon-1"
          AWS_REQUEST_CHECKSUM_CALCULATION: "when_required"
          AWS_RESPONSE_CHECKSUM_VALIDATION: "when_required"
          ENDPOINT: "https://${{ secrets.OCI_NAMESPACE }}.compat.objectstorage.ap-chuncheon-1.oraclecloud.com"
          BUCKET: ${{ secrets.OCI_BUCKET }}
        run: |
          # AWS CLI S3 설정 (Multipart 업로드 차단, v4 서명 및 경로 스타일 강제, 페이로드 서명 비활성화)
          aws configure set default.s3.multipart_threshold 512MB
          aws configure set default.s3.multipart_chunksize 512MB
          aws configure set default.s3.signature_version s3v4
          aws configure set default.s3.addressing_style path
          aws configure set default.s3.payload_signing false
          
          mkdir -p artifacts/api
          KEY="api/app-${{ github.run_id }}-${{ github.run_attempt }}.jar"
          echo "Downloading API artifact: $KEY"
          aws s3 cp "s3://$BUCKET/$KEY" artifacts/api/app.jar --endpoint-url "$ENDPOINT" --region ap-chuncheon-1
      - name: Download web dist
        if: ${{ needs.build-web.result == 'success' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.OCI_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.OCI_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: "ap-chuncheon-1"
          AWS_REQUEST_CHECKSUM_CALCULATION: "when_required"
          AWS_RESPONSE_CHECKSUM_VALIDATION: "when_required"
          ENDPOINT: "https://${{ secrets.OCI_NAMESPACE }}.compat.objectstorage.ap-chuncheon-1.oraclecloud.com"
          BUCKET: ${{ secrets.OCI_BUCKET }}
        run: |
          # AWS CLI S3 설정 (Multipart 업로드 차단, v4 서명 및 경로 스타일 강제, 페이로드 서명 비활성화)
          aws configure set default.s3.multipart_threshold 512MB
          aws configure set default.s3.multipart_chunksize 512MB
          aws configure set default.s3.signature_version s3v4
          aws configure set default.s3.addressing_style path
          aws configure set default.s3.payload_signing false
          
          mkdir -p artifacts/web
          KEY="web/web-dist-${{ github.run_id }}-${{ github.run_attempt }}.tar.gz"
          echo "Downloading WEB artifact: $KEY"
          aws s3 cp "s3://$BUCKET/$KEY" artifacts/web/web-dist.tar.gz --endpoint-url "$ENDPOINT" --region ap-chuncheon-1
          mkdir -p artifacts/web/dist
          tar -xzf artifacts/web/web-dist.tar.gz -C artifacts/web/dist
          rm -f artifacts/web/web-dist.tar.gz
      - name: Setup SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "${SSH_PORT:-22}" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Package crawler
        if: ${{ inputs.target == 'crawler' || inputs.target == 'all' }}
        run: |
          mkdir -p artifacts/crawler
          tar \
            --exclude='caskbycask-crawler/.env' \
            --exclude='caskbycask-crawler/.venv' \
            --exclude='*/__pycache__/*' \
            --exclude='*.pyc' \
            --exclude='caskbycask-crawler/logs' \
            --exclude='caskbycask-crawler/temp' \
            --exclude='caskbycask-crawler/*.db' \
            --exclude='caskbycask-crawler/targets.json' \
            -czf artifacts/crawler/crawler-dist.tar.gz caskbycask-crawler
      # 공통 디렉토리 + 운영 스크립트는 대상과 무관하게 항상 전송 (스크립트 자동 갱신 유지)
      - name: Transfer scripts (always)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          PORT="${SSH_PORT:-22}"
          SSH="ssh -i ~/.ssh/id_deploy -p $PORT $SSH_USER@$SSH_HOST"
          $SSH 'mkdir -p /app/spring-boot /app/next /app/scripts'
          # 서버 운영 스크립트 일괄 갱신 (배포/종료/점검/알림 등)
          scp -i ~/.ssh/id_deploy -P $PORT deploy/server/*.sh "$SSH_USER@$SSH_HOST:/app/scripts/"
          $SSH 'chmod +x /app/scripts/*.sh'
      - name: Transfer api jar
        if: ${{ needs.build-api.result == 'success' }}
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          PORT="${SSH_PORT:-22}"
          # 백엔드 jar → staging
          scp -i ~/.ssh/id_deploy -P $PORT artifacts/api/app.jar "$SSH_USER@$SSH_HOST:/app/spring-boot/app.jar.new"
      - name: Transfer web dist
        if: ${{ needs.build-web.result == 'success' }}
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          PORT="${SSH_PORT:-22}"
          SSH="ssh -i ~/.ssh/id_deploy -p $PORT $SSH_USER@$SSH_HOST"
          $SSH 'rm -rf /app/next/dist.new && mkdir -p /app/next/dist.new'
          # 프론트 dist → staging (rsync로 정확히 동기화)
          rsync -az --delete -e "ssh -i ~/.ssh/id_deploy -p $PORT" artifacts/web/dist/ "$SSH_USER@$SSH_HOST:/app/next/dist.new/"
      - name: Transfer crawler dist
        if: ${{ inputs.target == 'crawler' || inputs.target == 'all' }}
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          PORT="${SSH_PORT:-22}"
          scp -i ~/.ssh/id_deploy -P $PORT artifacts/crawler/crawler-dist.tar.gz "$SSH_USER@$SSH_HOST:/app/caskbycask-crawler-dist.tar.gz"
      # 교체 — 빌드된 쪽만. (프론트 먼저=무중단, 백엔드는 health check + 실패 시 롤백)
      - name: Deploy web (swap)
        if: ${{ needs.build-web.result == 'success' }}
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          PORT="${SSH_PORT:-22}"
          ssh -i ~/.ssh/id_deploy -p $PORT $SSH_USER@$SSH_HOST 'bash /app/scripts/deploy-web.sh'
      - name: Deploy api (swap + health check + rollback)
        if: ${{ needs.build-api.result == 'success' }}
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          PORT="${SSH_PORT:-22}"
          ssh -i ~/.ssh/id_deploy -p $PORT $SSH_USER@$SSH_HOST 'bash /app/scripts/deploy-api.sh'
      - name: Deploy crawler (release swap)
        if: ${{ inputs.target == 'crawler' || inputs.target == 'all' }}
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          PORT="${SSH_PORT:-22}"
          ssh -i ~/.ssh/id_deploy -p $PORT $SSH_USER@$SSH_HOST 'bash /app/scripts/deploy-crawler.sh'

  # 배포 결과 Slack 알림 — 빌드/배포 어느 단계가 깨졌는지 한 메시지로 요약.
  notify:
    needs: [resolve-ref, build-api, build-web, test-crawler, deploy]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Notify Slack (배포 결과)
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          REF_RESULT: ${{ needs.resolve-ref.result }}
          API_RESULT: ${{ needs.build-api.result }}
          WEB_RESULT: ${{ needs.build-web.result }}
          CRAWLER_RESULT: ${{ needs.test-crawler.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          REF: ${{ inputs.ref }}
          TARGET: ${{ inputs.target }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "${SLACK_WEBHOOK_URL:-}" ] || { echo "SLACK_WEBHOOK_URL 미설정 — 알림 건너뜀"; exit 0; }
          icon() { case "$1" in success) echo "✅";; failure) echo "❌";; cancelled) echo "⏹";; skipped) echo "⏭";; *) echo "❔";; esac; }
          # 대상 아닌 잡은 skipped — 정상으로 취급. failure/cancelled 만 실패로 본다.
          fail=0
          for r in "$REF_RESULT" "$API_RESULT" "$WEB_RESULT" "$CRAWLER_RESULT"; do
            case "$r" in failure|cancelled) fail=1;; esac
          done
          [ "$DEPLOY_RESULT" = success ] || fail=1
          if [ "$fail" = 0 ]; then
            COLOR=good;   SUMMARY="✅ 배포 성공 (${REF:-main} · ${TARGET:-both})"
          else
            COLOR=danger; SUMMARY="❌ 배포 실패 (${REF:-main} · ${TARGET:-both})"
          fi
          # \n 은 JSON 문자열 안에서 그대로 개행으로 해석됨
          BODY="소스 고정 $(icon "$REF_RESULT") · 백엔드 $(icon "$API_RESULT") · 프론트 $(icon "$WEB_RESULT") · 크롤러 $(icon "$CRAWLER_RESULT") · 배포 $(icon "$DEPLOY_RESULT")\\n실행: ${ACTOR}\\n<${RUN_URL}|GitHub Actions 로그>"
          payload=$(printf '{"channel":"#server-prd","username":"CaskByCask Deploy","icon_emoji":":rocket:","attachments":[{"color":"%s","title":"%s","text":"%s"}]}' "$COLOR" "$SUMMARY" "$BODY")
          curl -fsS -X POST -H 'Content-Type: application/json; charset=utf-8' -d "$payload" "$SLACK_WEBHOOK_URL" >/dev/null
