# ─────────────────────────────────────────────────────────────────────────────
# DrinkIndex — dev override (Oracle Cloud, drink-dev.pinner.dev)
# Cloudflare(프록시 / SSL 종료) → Compute Instance(80) → nginx(web) → api/uploads
# DB/Redis 는 호스트의 것을 사용 (base compose 의 extra_hosts 로 매핑됨).
# ─────────────────────────────────────────────────────────────────────────────

services:
  api:
    container_name: di-dev-api
    expose:
      - "8080"
      - "8081"
    deploy:
      resources:
        limits:
          memory: 1536M
        reservations:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  web:
    container_name: di-dev-web
    ports:
      - "80:80"
    environment:
      ROBOTS_NOINDEX: "on"
    build:
      args:
        BUILD_CMD: "build:no-prerender"
    deploy:
      resources:
        limits:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
