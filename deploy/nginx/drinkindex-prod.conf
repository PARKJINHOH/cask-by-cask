# ─────────────────────────────────────────────────────────────────────────────
# DrinkIndex (prod) — 호스트 네이티브 nginx 사이트 설정
#
# 설치:
#   sudo cp deploy/nginx/drinkindex-prod.conf /etc/nginx/sites-available/drinkindex-prod.conf
#   sudo ln -sf /etc/nginx/sites-available/drinkindex-prod.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# 구조:  Cloudflare → NPM(:80/443) → 이 nginx(:8091) → SPA 정적 + /api,/uploads → 127.0.0.1:8094(systemd)
#   · 정적 파일 root: /var/www/drinkindex-prod
#   · 백엔드: 127.0.0.1:8094 (drinkindex-prod-api.service)
#   · dev(8090/8092/8093)와 포트 분리. prod 는 검색엔진 색인 허용.
# ─────────────────────────────────────────────────────────────────────────────

# 실제 클라이언트 IP 복원 순서: Cloudflare → NPM(Docker bridge) → nginx
set_real_ip_from 127.0.0.1;
set_real_ip_from 172.16.0.0/12;
# Cloudflare IPv4
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 131.0.96.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
# Cloudflare IPv6
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Rate Limit zones (prod 전용 zone — dev 의 di_dev_* 와 이름 분리)
limit_req_zone $binary_remote_addr zone=di_prod_login:10m  rate=20r/m;
limit_req_zone $binary_remote_addr zone=di_prod_signup:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=di_prod_email:10m  rate=5r/m;
limit_req_zone $binary_remote_addr zone=di_prod_api:10m    rate=600r/m;

server {
    listen 8091;
    server_name drinkindex.pinner.dev;

    root /var/www/drinkindex-prod;
    index index.html;

    charset utf-8;
    client_max_body_size 55M;   # 동영상 업로드 50MB + 여유
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # prod 는 검색엔진 색인 허용 (dev 와 달리 X-Robots-Tag noindex 없음)

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain text/css text/xml text/javascript application/javascript
        application/json application/xml application/xml+rss image/svg+xml font/woff2;

    # 헬스체크
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    # 동영상 업로드 — 타임아웃 연장 + 버퍼링 비활성 (50MB 파일을 메모리에 쌓지 않음)
    location = /api/posts/videos {
        proxy_pass http://127.0.0.1:8094;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;   # 업로드 파일을 nginx 임시 디스크에 쌓지 않고 바로 Spring 으로 전달
        proxy_read_timeout 180s;       # 50MB 저속 업로드 대비
        proxy_send_timeout 180s;
        limit_req zone=di_prod_api burst=5 nodelay;
        limit_req_status 429;
    }

    # 동영상 스트리밍 — 버퍼링 비활성으로 Range(seek) 응답을 즉시 전달
    location ^~ /api/posts/videos/ {
        proxy_pass http://127.0.0.1:8094;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Range $http_range;          # Range 헤더를 백엔드에 그대로 전달
        proxy_set_header If-Range $http_if_range;
        proxy_buffering off;                         # 동영상 seek 즉시 응답
        proxy_read_timeout 120s;
        add_header Accept-Ranges bytes always;
    }

    # 백엔드 API 프록시
    location /api/ {
        proxy_pass http://127.0.0.1:8094;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        limit_req zone=di_prod_api burst=200 nodelay;
        limit_req_status 429;
    }

    location = /api/auth/login {
        limit_req zone=di_prod_login burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8094;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /api/auth/signup {
        limit_req zone=di_prod_signup burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8094;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /api/auth/send-verification {
        limit_req zone=di_prod_email burst=2 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8094;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 업로드 정적 자원 (백엔드가 서빙)
    location /uploads/ {
        proxy_pass http://127.0.0.1:8094;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # Actuator 외부 차단
    location /actuator { return 404; }

    # SEO: sitemap.xml (api 동적 생성)
    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:8094/sitemap.xml;
        proxy_set_header Host $host;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # 해시된 자산 1년 캐시
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable, max-age=31536000";
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
        location = /index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            expires off;
        }
    }
}
