# ─────────────────────────────────────────────────────────────────────────────
# DrinkIndex (dev) — 호스트 네이티브 nginx 사이트 설정
#
# 설치:
#   sudo cp deploy/nginx/drinkindex-dev.conf /etc/nginx/sites-available/drinkindex-dev.conf
#   sudo ln -sf /etc/nginx/sites-available/drinkindex-dev.conf /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default      # 80 포트 점유 default 사이트 제거 (NPM 과 충돌 방지)
#   sudo nginx -t && sudo systemctl reload nginx
#
# 구조:  Cloudflare → NPM(:80/443) → 이 nginx(:8090) → SPA 정적 + /api,/uploads → 127.0.0.1:8092(systemd)
#   · 정적 파일 root: /var/www/drinkindex-dev
#   · 백엔드: 127.0.0.1:8092 (drinkindex-dev-api.service)
# ─────────────────────────────────────────────────────────────────────────────

# 실제 클라이언트 IP — Cloudflare → NPM 을 거치므로 내부(docker/localhost) 출처를 신뢰하고
# X-Forwarded-For 에서 추출. (NPM 컨테이너가 docker bridge 대역에서 들어옴)
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 127.0.0.1;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Rate Limit zones (IP당 거시적 차단)
limit_req_zone $binary_remote_addr zone=di_dev_login:10m  rate=20r/m;
limit_req_zone $binary_remote_addr zone=di_dev_signup:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=di_dev_email:10m  rate=5r/m;
limit_req_zone $binary_remote_addr zone=di_dev_api:10m    rate=600r/m;

server {
    listen 8090;
    server_name drink-dev.pinner.dev;

    root /var/www/drinkindex-dev;
    index index.html;

    charset utf-8;
    client_max_body_size 15M;
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # dev 는 검색엔진 색인 차단
    add_header X-Robots-Tag "noindex, nofollow" always;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain text/css text/xml text/javascript application/javascript
        application/json application/xml application/xml+rss image/svg+xml font/woff2;

    # 헬스체크
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    # 백엔드 API 프록시
    location /api/ {
        proxy_pass http://127.0.0.1:8092;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        limit_req zone=di_dev_api burst=200 nodelay;
        limit_req_status 429;
    }

    location = /api/auth/login {
        limit_req zone=di_dev_login burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8092;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /api/auth/signup {
        limit_req zone=di_dev_signup burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8092;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /api/auth/send-verification {
        limit_req zone=di_dev_email burst=2 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8092;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 업로드 정적 자원 (백엔드가 서빙)
    location /uploads/ {
        proxy_pass http://127.0.0.1:8092;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # Actuator 외부 차단
    location /actuator { return 404; }

    # SEO: sitemap.xml (api 동적 생성)
    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:8092/sitemap.xml;
        proxy_set_header Host $host;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # 해시된 자산 1년 캐시
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable, max-age=31536000";
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
        location = /index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            expires off;
        }
    }
}
