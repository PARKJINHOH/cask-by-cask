# =============================================================================
# monitoring.caskbycask.net — Grafana reverse proxy
# Basic Auth(nginx) + Grafana 자체 로그인 이중 보호
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name monitoring.caskbycask.net;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name monitoring.caskbycask.net;

    # Cloudflare Origin Certificate (메인 도메인과 동일 인증서 사용 가능)
    ssl_certificate     /etc/ssl/certs/cloudflare-origin.pem;
    ssl_certificate_key /etc/ssl/private/cloudflare-origin-key.pem;

    # nginx 레벨 Basic Auth (1차 방어)
    auth_basic           "CaskByCask Monitoring";
    auth_basic_user_file /etc/nginx/.htpasswd-monitoring;

    # Grafana WebSocket 지원 (실시간 대시보드)
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade            $http_upgrade;
        proxy_set_header   Connection         "upgrade";
        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  https;
        proxy_read_timeout 600s;
    }
}
