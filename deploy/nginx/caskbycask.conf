# ─────────────────────────────────────────────────────────────────────────────
# CaskByCask (prod) — nginx 사이트 설정
#
# 설치:
#   sudo cp deploy/nginx/caskbycask.conf /etc/nginx/sites-available/caskbycask.conf
#   sudo ln -sf /etc/nginx/sites-available/caskbycask.conf /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# 구조:  Cloudflare(Proxied, Full strict) → nginx(:443) → SPA 정적(/app/vite/dist)
#                                                       └ /api → 127.0.0.1:8080 (caskbycask-api.service)
#                                                       └ /uploads → /app/upload (직접 서빙)
#   · Cloudflare Origin Certificate 를 /etc/nginx/ssl/ 에 설치
# ─────────────────────────────────────────────────────────────────────────────

# 실제 클라이언트 IP 복원 (Cloudflare → nginx)
set_real_ip_from 127.0.0.1;
# Cloudflare IPv4
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 131.0.96.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
# Cloudflare IPv6
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;
real_ip_recursive on;

# Rate Limit zones
limit_req_zone $binary_remote_addr zone=cbc_login:10m  rate=20r/m;
limit_req_zone $binary_remote_addr zone=cbc_signup:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=cbc_email:10m  rate=5r/m;
limit_req_zone $binary_remote_addr zone=cbc_api:10m    rate=600r/m;

# HTTP → HTTPS 리다이렉트
server {
    listen 80;
    listen [::]:80;
    server_name caskbycask.net www.caskbycask.net;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name caskbycask.net www.caskbycask.net;

    # Cloudflare Origin Certificate
    ssl_certificate     /etc/nginx/ssl/caskbycask.net.pem;
    ssl_certificate_key /etc/nginx/ssl/caskbycask.net.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /app/vite/dist;
    index index.html;

    charset utf-8;
    client_max_body_size 55M;   # 동영상 업로드 50MB + 여유
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain text/css text/xml text/javascript application/javascript
        application/json application/xml application/xml+rss image/svg+xml font/woff2;

    # 헬스체크 (Cloudflare/모니터링용)
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    # 동영상 업로드 — 타임아웃 연장 + 버퍼링 비활성
    location = /api/posts/videos {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        limit_req zone=cbc_api burst=5 nodelay;
        limit_req_status 429;
    }

    # 동영상 스트리밍 — Range(seek) 즉시 응답
    location ^~ /api/posts/videos/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_buffering off;
        proxy_read_timeout 120s;
        add_header Accept-Ranges bytes always;
    }

    # 로그인/회원가입/이메일 — 개별 Rate Limit
    location = /api/auth/login {
        limit_req zone=cbc_login burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /api/auth/signup {
        limit_req zone=cbc_signup burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /api/auth/send-verification {
        limit_req zone=cbc_email burst=2 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 백엔드 API 프록시
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        limit_req zone=cbc_api burst=200 nodelay;
        limit_req_status 429;
    }

    # 업로드 정적 자원 — nginx 가 /app/upload 에서 직접 서빙
    location /uploads/ {
        alias /app/upload/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # Actuator 외부 차단
    location /actuator { return 404; }

    # SEO: sitemap.xml (api 동적 생성)
    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:8080/sitemap.xml;
        proxy_set_header Host $host;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # 해시된 자산 1년 캐시
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable, max-age=31536000";
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
        location = /index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            expires off;
        }
    }
}
