# ─────────────────────────────────────────────────────────────────────────────
# CaskByCask (prod) — nginx 사이트 설정
#
# 설치: (운영서버엔 레포를 클론하지 않음 — 이 파일을 FTP 로 ~/setup/ 에 올린 뒤 진행)
#       전체 셋업 절차는 deploy/server/setup-server.md 8장 참고
#   sudo cp ~/setup/caskbycask.conf /etc/nginx/sites-available/caskbycask.conf
#   sudo ln -sf /etc/nginx/sites-available/caskbycask.conf /etc/nginx/sites-enabled/caskbycask.conf
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# 구조:  Cloudflare(Proxied, Full strict) → nginx(:443) → SPA 정적(/app/vite/dist)
#                                                       └ /api → 127.0.0.1:8080 (caskbycask-api.service)
#                                                       └ /uploads → /app/upload (직접 서빙)
#   · Cloudflare Origin Certificate 를 /etc/nginx/ssl/ 에 설치
# ─────────────────────────────────────────────────────────────────────────────

# 실제 클라이언트 IP 복원 (Cloudflare → nginx)
set_real_ip_from 127.0.0.1;
# Cloudflare IPv4
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 131.0.96.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
# Cloudflare IPv6
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;
real_ip_recursive on;

# Rate Limit zones
limit_req_zone $binary_remote_addr zone=cbc_login:10m  rate=20r/m;
limit_req_zone $binary_remote_addr zone=cbc_signup:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=cbc_email:10m  rate=5r/m;
limit_req_zone $binary_remote_addr zone=cbc_api:10m    rate=600r/m;

# HTTP → HTTPS 리다이렉트
server {
    listen 80;
    listen [::]:80;
    server_name caskbycask.net www.caskbycask.net;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name caskbycask.net www.caskbycask.net;

    # Cloudflare Origin Certificate
    ssl_certificate     /etc/nginx/ssl/caskbycask.net.pem;
    ssl_certificate_key /etc/nginx/ssl/caskbycask.net.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /app/vite/dist;
    index index.html;

    charset utf-8;
    client_max_body_size 55M;   # 동영상 업로드 50MB + 여유
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain text/css text/xml text/javascript application/javascript
        application/json application/xml application/xml+rss image/svg+xml font/woff2;

    # ── 서버 점검 모드 ──────────────────────────────────────────────────────
    # /app/vite/maintenance.on 플래그가 있으면 SPA/API 를 점검 응답으로 전환한다.
    # 플래그는 요청마다 평가되어 nginx reload 가 필요 없다 → maintenance.sh on|off|status 로 토글.
    # (헬스체크 /healthz 는 점검 중에도 항상 200 — Cloudflare/모니터링이 오탐하지 않도록)
    set $maintenance off;
    if (-f /app/vite/maintenance.on) { set $maintenance on; }

    # 관리자 우회: cbc_maint 쿠키 값이 시크릿과 일치하면 점검 중에도 정상 접근.
    #   · 쿠키 심기: 관리자가 비밀 URL `/__cbc_unlock_<시크릿>` 을 1회 방문 → 쿠키 발급 후 홈으로
    #   · IP 가 바뀌어도(집/모바일/외부망/Cloudflare) 쿠키만 있으면 계속 우회됨
    #   · ⚠️ 아래 <CHANGE_ME...> 2곳을 동일한 긴 랜덤 문자열로 교체하고, git 에 올리지 말 것
    #        (예: openssl rand -hex 24 로 생성)
    if ($cookie_cbc_maint = "CHANGE_ME_TO_A_LONG_RANDOM_SECRET") { set $maintenance off; }

    # 점검 우회 쿠키 발급 — 시크릿이 경로에 포함되어 이를 아는 사람만 호출 가능
    location = /__cbc_unlock_CHANGE_ME_TO_A_LONG_RANDOM_SECRET {
        add_header Set-Cookie "cbc_maint=CHANGE_ME_TO_A_LONG_RANDOM_SECRET; Path=/; Max-Age=86400; Secure; HttpOnly; SameSite=Lax" always;
        add_header Cache-Control "no-store" always;
        return 302 /;
    }

    # 점검 페이지(SPA 방문자용 HTML) — error_page 내부 리다이렉트로만 노출
    location = /maintenance.html {
        internal;
        root /app/vite;          # dist 와 분리 보관 → 배포(dist 교체)에 영향 없음
        charset utf-8;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }
    # 점검 중 API 응답(JSON) — ApiResponse 래퍼 형태와 동일
    location @maintenance_api {
        default_type application/json;
        charset utf-8;
        add_header Cache-Control "no-store" always;
        return 503 '{"success":false,"data":null,"code":"SERVER_MAINTENANCE","message":"서버 점검 중입니다. 잠시 후 다시 시도해주세요."}';
    }

    # 헬스체크 (Cloudflare/모니터링용)
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    # 동영상 업로드 — 타임아웃 연장 + 버퍼링 비활성
    location = /api/posts/videos {
        if ($maintenance = on) { return 598; }
        error_page 598 @maintenance_api;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        limit_req zone=cbc_api burst=5 nodelay;
        limit_req_status 429;
    }

    # 동영상 스트리밍 — Range(seek) 즉시 응답
    location ^~ /api/posts/videos/ {
        if ($maintenance = on) { return 598; }
        error_page 598 @maintenance_api;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_buffering off;
        proxy_read_timeout 120s;
        add_header Accept-Ranges bytes always;
    }

    # 로그인/회원가입/이메일 — 개별 Rate Limit
    location = /api/auth/login {
        if ($maintenance = on) { return 598; }
        error_page 598 @maintenance_api;
        limit_req zone=cbc_login burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /api/auth/signup {
        if ($maintenance = on) { return 598; }
        error_page 598 @maintenance_api;
        limit_req zone=cbc_signup burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /api/auth/send-verification {
        if ($maintenance = on) { return 598; }
        error_page 598 @maintenance_api;
        limit_req zone=cbc_email burst=2 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 백엔드 API 프록시
    location /api/ {
        if ($maintenance = on) { return 598; }   # 점검 시 → JSON 503
        error_page 598 @maintenance_api;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        limit_req zone=cbc_api burst=200 nodelay;
        limit_req_status 429;
    }

    # 업로드 정적 자원 — nginx 가 /app/upload 에서 직접 서빙
    location /uploads/ {
        alias /app/upload/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # Actuator 외부 차단
    location /actuator { return 404; }

    # SEO: sitemap.xml (api 동적 생성)
    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:8080/sitemap.xml;
        proxy_set_header Host $host;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # 해시된 자산 1년 캐시
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable, max-age=31536000";
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        if ($maintenance = on) { return 598; }   # 점검 시 → 점검 페이지(503)
        error_page 598 =503 /maintenance.html;
        try_files $uri $uri/ /index.html;
        location = /index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            expires off;
        }
    }
}
