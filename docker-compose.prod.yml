# ─────────────────────────────────────────────────────────────────────────────
# DrinkIndex — prod override (Oracle Cloud)
# Cloudflare → Compute Instance(80) → nginx(web container) → api/uploads
# DB/Redis 는 호스트의 것을 사용 (base compose 의 extra_hosts 로 매핑됨).
# ─────────────────────────────────────────────────────────────────────────────

services:
  api:
    container_name: di-prod-api
    expose:
      - "8080"
      - "8081"   # actuator (외부 노출 X, prometheus container 만 접근)
    deploy:
      resources:
        limits:
          memory: 1536M
        reservations:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  web:
    container_name: di-prod-web
    ports:
      - "80:80"
    deploy:
      resources:
        limits:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
