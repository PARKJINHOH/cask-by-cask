<style>
  html, body { background-color: #F7F8FA; font-family: 'Pretendard', sans-serif; }

  /* ── Dual range slider ── */
  .range-wrap { position: relative; height: 20px; display: flex; align-items: center; }
  .range-dual {
    pointer-events: none;
    -webkit-appearance: none;
    appearance: none;
    background: transparent;
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    outline: none;
    margin: 0;
  }
  .range-dual::-webkit-slider-runnable-track { background: transparent; height: 6px; }
  .range-dual::-moz-range-track { background: transparent; height: 6px; }
  .range-dual::-webkit-slider-thumb {
    pointer-events: auto;
    -webkit-appearance: none;
    width: 16px; height: 16px; border-radius: 50%;
    background: #ffffff; border: 2px solid #92400e; cursor: pointer;
    box-shadow: 0 1px 3px rgb(0 0 0 / 0.15);
    margin-top: -5px;
  }
  .range-dual::-moz-range-thumb {
    pointer-events: auto;
    width: 16px; height: 16px; border-radius: 50%;
    background: #ffffff; border: 2px solid #92400e; cursor: pointer;
    box-shadow: 0 1px 3px rgb(0 0 0 / 0.15);
  }

  /* drawer transition */
  #mobileDrawer, #drawerBackdrop { transition: transform 0.28s cubic-bezier(0.22,1,0.36,1), opacity 0.28s ease; }

  /* lightbox */
  #lightbox { transition: opacity 0.2s ease; }
  #lightbox.hidden-lb { opacity: 0; pointer-events: none; }
  #lightbox img { transition: transform 0.2s ease; }

  .accordion-icon { transition: transform 0.2s ease; }
  .accordion-open .accordion-icon { transform: rotate(180deg); }
  .accordion-body { display: none; }
  .accordion-open .accordion-body { display: block; }
</style>
</head>

<body class="text-neutral-900 antialiased">

<!-- ───────────── 상단 미니 헤더 (참고용, 실제 MainLayout 헤더 대체 아님) ───────────── -->
<header class="bg-neutral-900 text-white">
  <div class="max-w-[1440px] mx-auto px-4 lg:px-8 h-14 flex items-center justify-between">
    <span class="font-display text-lg font-bold text-primary-400 tracking-wide">DrinkIndex</span>
    <span class="text-xs text-neutral-400">/ spirits 리디자인 프리뷰 (정적 목업, 실데이터 아님)</span>

</header>

<!-- ───────────── 메인 영역 ───────────── -->
<div class="max-w-[1440px] mx-auto px-4 lg:px-8 py-6 flex gap-6 items-start">

  <!-- 좌측 필터 사이드바 자리 확보용 spacer (실제 패널은 fixed 로 분리되어 본문 스크롤과 무관) -->
  <aside id="filterSpacer" class="hidden lg:block w-72 flex-shrink-0"></aside>
  <div id="desktopFilter" class="hidden lg:block fixed top-[4.5rem] w-72 h-[calc(100vh-5.5rem)] overflow-y-auto bg-white rounded-2xl border border-neutral-200 p-4 space-y-5 z-10"></div>

  <!-- 우측 결과 영역 -->
  <main class="flex-1 min-w-0">
    <!-- 결과 개수 + 필터/정렬 -->
    <div class="flex items-center justify-between mb-3 gap-2">
      <p class="text-sm text-neutral-500">총 <span id="resultCount" class="font-semibold text-neutral-900">16</span>개</p>
      <div class="flex items-center gap-2">
        <!-- 모바일 필터 버튼 -->
        <button id="openDrawerBtn" type="button"
          class="lg:hidden relative inline-flex items-center gap-1.5 px-3.5 py-2 rounded-lg border border-neutral-200 bg-white text-sm font-medium text-neutral-700">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
          필터

        </button>
        <select id="sortSelect" class="text-sm rounded-lg border border-neutral-200 bg-white px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary-500/40">
          <option value="LATEST">최신순</option>
          <option value="SCORE_DESC">평점순</option>
          <option value="REVIEW_COUNT_DESC">리뷰 많은순</option>
        </select>
      </div>
    </div>

    <!-- 활성 필터 칩 바 -->
    <div id="activeChipsWrap" class="hidden mb-4 flex flex-wrap items-center gap-2 bg-neutral-50/70 border border-neutral-200 rounded-lg px-3 py-2.5">
      <span class="text-xs font-medium text-neutral-500 mr-1">적용된 필터</span>
      <div id="activeChips" class="flex flex-wrap gap-1.5"></div>
      <button data-reset class="ml-auto text-xs font-medium text-danger-600 hover:text-danger-700 hover:underline">모두 지우기</button>
    </div>

    <!-- 결과 그리드 -->
    <div id="grid" class="grid grid-cols-2 sm:grid-cols-3 xl:grid-cols-4 gap-3 lg:gap-4"></div>

    <!-- 결과 없음 -->
    <div id="emptyState" class="hidden flex-col items-center justify-center text-center py-20">
      <div class="w-14 h-14 rounded-full bg-neutral-100 flex items-center justify-center mb-3">
        <svg class="w-7 h-7 text-neutral-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      </div>
      <p class="text-sm font-semibold text-neutral-700">조건에 맞는 술이 없어요</p>

      <button data-reset class="mt-3 text-sm font-medium text-primary-700 hover:underline">필터 초기화</button>

    <!-- 페이지네이션 (장식용) -->
    <div class="flex items-center justify-center gap-1.5 mt-8">
      <button class="w-9 h-9 rounded-lg border border-neutral-200 bg-white text-neutral-400 flex items-center justify-center" disabled>
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      </button>
      <button class="w-9 h-9 rounded-lg bg-primary-800 text-white text-sm font-semibold">1</button>
      <button class="w-9 h-9 rounded-lg border border-neutral-200 bg-white text-sm font-medium text-neutral-600 hover:bg-neutral-50">2</button>
      <button class="w-9 h-9 rounded-lg border border-neutral-200 bg-white text-sm font-medium text-neutral-600 hover:bg-neutral-50">3</button>
      <button class="w-9 h-9 rounded-lg border border-neutral-200 bg-white text-neutral-600 flex items-center justify-center hover:bg-neutral-50">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
      </button>
    </div>
  </main>
</div>

<!-- ───────────── 모바일 필터 드로어 ───────────── -->
<div id="drawerBackdrop" class="lg:hidden fixed inset-0 bg-black/40 z-40 opacity-0 pointer-events-none"></div>
<div id="mobileDrawer" class="lg:hidden fixed inset-y-0 left-0 w-[85vw] max-w-sm bg-white z-50 -translate-x-full flex flex-col">
  <div class="flex items-center justify-between px-4 h-14 border-b border-neutral-200 flex-shrink-0">
    <h2 class="font-display text-lg font-bold">필터</h2>
    <button id="closeDrawerBtn" class="w-9 h-9 flex items-center justify-center rounded-full hover:bg-neutral-100">
      <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>

  <div id="mobileFilter" class="flex-1 overflow-y-auto p-4 space-y-5"></div>
  <div class="flex gap-2 p-4 border-t border-neutral-200 flex-shrink-0">
    <button data-reset class="flex-1 py-3 rounded-xl border border-neutral-200 text-sm font-semibold text-neutral-600">초기화</button>
    <button id="applyDrawerBtn" class="flex-1 py-3 rounded-xl bg-primary-800 text-white text-sm font-semibold">결과 보기 (<span id="applyCount">16</span>)</button>

<!-- ───────────── 라이트박스 ───────────── -->
<div id="lightbox" class="hidden-lb fixed inset-0 z-[60] bg-black/80 flex flex-col items-center justify-center p-4">

    <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
  </button>
  <img id="lightboxImg" src="" alt="" class="max-w-[96vw] max-h-[90vh] rounded-xl object-contain shadow-2xl" />
  <p id="lightboxCaption" class="mt-3 text-sm text-white/80"></p>
</div>

<script>
/* ════════════════════════ 데이터 정의 ════════════════════════ */
const CATEGORY_LABEL = { WHISKY: '위스키', WINE: '와인', COGNAC: '꼬냑', OTHER: '기타' };

const CATEGORIES = {
  WHISKY: { subKey: 'whiskyStyle', subs: [
    ['SINGLE_MALT','싱글몰트'], ['BLENDED_MALT','블렌디드 몰트'], ['BLENDED_WHISKY','블렌디드 위스키'],
    ['BOURBON','버번'], ['TENNESSEE','테네시'], ['RYE','라이'], ['POT_STILL','팟 스틸'], ['GRAIN_CORN','그레인/콘'],
  ]},
  WINE: { subKey: 'wineType', subs: [
    ['RED','레드'], ['WHITE','화이트'], ['ROSE','로제'], ['SPARKLING','스파클링'],
    ['DESSERT','디저트'], ['ORANGE','오렌지'], ['FORTIFIED','주정강화'],
  ]},
  COGNAC: { subKey: 'cognacGrade', subs: [
    ['VS','VS'], ['NAPOLEON','나폴레옹'], ['VSOP','VSOP'], ['XO','XO'], ['XXO','XXO'], ['HORS_DAGE','오르다주'],
  ]},
  OTHER: { subKey: null, subs: [] },
};

const QUICK_COUNTRIES = ['스코틀랜드','일본','미국','프랑스','아일랜드'];

const REGIONS = {
  WHISKY: {
    '스코틀랜드': ['Speyside','Highland','Islay','Lowland'],
    '일본': ['혼슈','홋카이도'],
    '미국': ['Kentucky','Tennessee'],
    '아일랜드': ['Cork','Midleton'],
  },
  WINE: {
    '프랑스': ['Bordeaux','Burgundy','Champagne'],
    '미국': ['Napa Valley','Sonoma'],
  },
};

const SPIRITS = [
  { id:1, category:'WHISKY', whiskyStyle:'SINGLE_MALT', nameKo:'더 맥캘란 18년', nameEn:'The Macallan 18 Year', country:'스코틀랜드', region:'Speyside', abv:43, avgScore:92, reviewCount:340, bg:['#92400e','#d97706'] },
  { id:2, category:'WHISKY', whiskyStyle:'SINGLE_MALT', nameKo:'글렌피딕 12년', nameEn:'Glenfiddich 12 Year', country:'스코틀랜드', region:'Speyside', abv:40, avgScore:85, reviewCount:210, bg:['#b45309','#fbbf24'] },
  { id:3, category:'WHISKY', whiskyStyle:'BOURBON', nameKo:'버팔로 트레이스', nameEn:'Buffalo Trace', country:'미국', region:'Kentucky', abv:45, avgScore:88, reviewCount:150, bg:['#78350f','#f59e0b'] },
  { id:4, category:'WHISKY', whiskyStyle:'BOURBON', nameKo:'메이커스 마크', nameEn:"Maker's Mark", country:'미국', region:'Kentucky', abv:45, avgScore:84, reviewCount:120, bg:['#92400e','#fcd34d'] },
  { id:5, category:'WHISKY', whiskyStyle:'BLENDED_WHISKY', nameKo:'히비키 하모니', nameEn:'Hibiki Harmony', country:'일본', region:'혼슈', abv:43, avgScore:90, reviewCount:410, bg:['#b45309','#fde68a'] },
  { id:6, category:'WHISKY', whiskyStyle:'SINGLE_MALT', nameKo:'야마자키 12년', nameEn:'Yamazaki 12 Year', country:'일본', region:'혼슈', abv:43, avgScore:93, reviewCount:530, bg:['#92400e','#fbbf24'] },
  { id:7, category:'WHISKY', whiskyStyle:'RYE', nameKo:'위슬피그 10년', nameEn:'WhistlePig 10 Year', country:'미국', region:'Tennessee', abv:50, avgScore:87, reviewCount:95, bg:['#78350f','#d97706'] },
  { id:8, category:'WHISKY', whiskyStyle:'POT_STILL', nameKo:'레드브레스트 12년', nameEn:'Redbreast 12 Year', country:'아일랜드', region:'Cork', abv:40, avgScore:89, reviewCount:180, bg:['#b45309','#f59e0b'] },
  { id:9, category:'WINE', wineType:'RED', nameKo:'샤토 마고', nameEn:'Château Margaux', country:'프랑스', region:'Bordeaux', abv:13.5, avgScore:96, reviewCount:60, bg:['#7f1d1d','#b91c1c'] },
  { id:10, category:'WINE', wineType:'WHITE', nameKo:'샤블리', nameEn:'Chablis', country:'프랑스', region:'Burgundy', abv:12.5, avgScore:88, reviewCount:75, bg:['#a16207','#fde68a'] },
  { id:11, category:'WINE', wineType:'SPARKLING', nameKo:'동 페리뇽', nameEn:'Dom Pérignon', country:'프랑스', region:'Champagne', abv:12.5, avgScore:95, reviewCount:130, bg:['#92400e','#fcd34d'] },
  { id:12, category:'WINE', wineType:'RED', nameKo:'오퍼스 원', nameEn:'Opus One', country:'미국', region:'Napa Valley', abv:14.5, avgScore:94, reviewCount:88, bg:['#7f1d1d','#dc2626'] },
  { id:13, category:'COGNAC', cognacGrade:'XO', nameKo:'헤네시 XO', nameEn:'Hennessy XO', country:'프랑스', region:null, abv:40, avgScore:91, reviewCount:220, bg:['#78350f','#b45309'] },
  { id:14, category:'COGNAC', cognacGrade:'VSOP', nameKo:'레미 마틴 VSOP', nameEn:'Rémy Martin VSOP', country:'프랑스', region:null, abv:40, avgScore:86, reviewCount:140, bg:['#92400e','#d97706'] },
  { id:15, category:'OTHER', nameKo:'핸드릭스 진', nameEn:"Hendrick's Gin", country:'영국', region:null, abv:41.4, avgScore:89, reviewCount:160, bg:['#1f2937','#6b7280'] },
  { id:16, category:'OTHER', nameKo:'디플로마티코 레제르바', nameEn:'Diplomatico Reserva', country:'베네수엘라', region:null, abv:40, avgScore:87, reviewCount:90, bg:['#374151','#9ca3af'] },
  { id:17, category:'WHISKY', whiskyStyle:'SINGLE_MALT', nameKo:'글렌모렌지 시그넷 하이랜드 싱글몰트 캐스크 스트렝스 한정판', nameEn:'Glenmorangie Signet Highland Single Malt Cask Strength Limited Edition', country:'스코틀랜드', region:'Highland', abv:46, avgScore:91.5, reviewCount:48, bg:['#92400e','#fbbf24'] },
];

/* ════════════════════════ 상태 ════════════════════════ */
const state = {
  category: null,        // 'WHISKY' | 'WINE' | 'COGNAC' | 'OTHER' | null
  whiskyStyles: [], wineTypes: [], cognacGrades: [],
  country: null,
  region: null,
  abvMin: 0, abvMax: 100,
  scoreMin: 0, scoreMax: 100,
  sort: 'LATEST',
  expandedCategory: null,
  countrySearch: '',
};

const SUB_FIELD = { WHISKY: 'whiskyStyles', WINE: 'wineTypes', COGNAC: 'cognacGrades' };

/* ════════════════════════ 유틸 ════════════════════════ */
function scoreColor(score) {
  if (score >= 90) return '#16a34a';
  if (score >= 80) return '#d97706';
  return '#9ca3af';
}
function placeholderImg([c1, c2], label, w = 300, h = 400) {
  const fontSize = Math.round(w * 0.073);
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
    <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/>
    </linearGradient></defs>
    <rect width="${w}" height="${h}" fill="url(#g)"/>
    <text x="${w / 2}" y="${h * 0.51}" font-family="Playfair Display, serif" font-size="${fontSize}" font-weight="700"
      fill="rgba(255,255,255,0.92)" text-anchor="middle" dominant-baseline="middle">${label}</text>
  </svg>`;
  return 'data:image/svg+xml,' + encodeURIComponent(svg);
}

/* ════════════════════════ 필터 패널 렌더 ════════════════════════ */
function renderFilterPanel() {
  let html = '';

  // 카테고리
  html += `<div>
    <h3 class="text-sm font-bold text-neutral-900 mb-2">카테고리</h3>
    <div class="space-y-1">`;
  for (const cat of Object.keys(CATEGORIES)) {
    const isOpen = state.expandedCategory === cat;
    const isSelected = state.category === cat;
    const subs = CATEGORIES[cat].subs;
    html += `<div class="${isOpen ? 'accordion-open' : ''} rounded-xl ${isSelected ? 'bg-primary-50' : ''}">
      <button data-cat="${cat}" type="button"
        class="w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-sm font-medium
          ${isSelected ? 'text-primary-900' : 'text-neutral-700 hover:bg-neutral-50'}">
        <span>${CATEGORY_LABEL[cat]}</span>
        ${subs.length ? `<svg class="accordion-icon w-4 h-4 text-neutral-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>` : ''}
      </button>`;
    if (subs.length) {
      const subField = SUB_FIELD[cat];
      html += `<div class="accordion-body px-3 pb-3 pt-1 flex flex-wrap gap-1.5">`;
      for (const [code, label] of subs) {
        const active = state[subField].includes(code);
        html += `<button data-sub="${cat}:${code}" type="button"
          class="px-2.5 py-1 rounded-full text-xs font-medium border transition-colors
            ${active ? 'bg-primary-800 border-primary-800 text-white' : 'bg-white border-neutral-200 text-neutral-600 hover:border-primary-300'}">${label}</button>`;
      }
      html += `</div>`;
    }
    html += `</div>`;
  }
  html += `</div></div>`;

  // 국가
  const countryCounts = {};
  SPIRITS.forEach(s => { countryCounts[s.country] = (countryCounts[s.country] || 0) + 1; });
  let countryList = Object.keys(countryCounts);
  if (state.countrySearch) {
    countryList = countryList.filter(c => c.includes(state.countrySearch));
  }
  countryList.sort((a, b) => countryCounts[b] - countryCounts[a]);

  html += `<div class="pt-4 border-t border-neutral-100">
    <h3 class="text-sm font-bold text-neutral-900 mb-2">국가</h3>
    <div class="relative mb-2">
      <svg class="absolute left-2.5 top-1/2 -translate-y-1/2 w-3.5 h-3.5 text-neutral-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input data-country-search type="text" placeholder="국가 검색" value="${state.countrySearch}"
        class="w-full pl-8 pr-2 py-1.5 text-xs rounded-lg border border-neutral-200 focus:outline-none focus:ring-2 focus:ring-primary-500/40" />
    </div>
    <div class="flex flex-wrap gap-1.5 mb-2">
      ${QUICK_COUNTRIES.map(c => `<button data-country="${c}" type="button"
        class="px-2.5 py-1 rounded-full text-xs font-medium border transition-colors
          ${state.country === c ? 'bg-primary-800 border-primary-800 text-white' : 'bg-white border-neutral-200 text-neutral-600 hover:border-primary-300'}">${c}</button>`).join('')}
    </div>
    <div class="space-y-0.5 max-h-40 overflow-y-auto">
      ${countryList.map(c => `<button data-country="${c}" type="button"
        class="w-full flex items-center justify-between px-2.5 py-1.5 rounded-lg text-xs
          ${state.country === c ? 'bg-primary-50 text-primary-900 font-semibold' : 'text-neutral-600 hover:bg-neutral-50'}">
        <span>${c}</span><span class="text-neutral-400">${countryCounts[c]}</span></button>`).join('')}
      ${countryList.length === 0 ? `<p class="text-xs text-neutral-400 px-2.5 py-1.5">검색 결과 없음</p>` : ''}
    </div>
  </div>`;

  // 지역 (WHISKY/WINE + 국가 선택 시)
  if ((state.category === 'WHISKY' || state.category === 'WINE') && state.country && REGIONS[state.category]?.[state.country]) {
    const regions = REGIONS[state.category][state.country];
    html += `<div class="pt-4 border-t border-neutral-100">
      <h3 class="text-sm font-bold text-neutral-900 mb-2">지역</h3>
      <div class="flex flex-wrap gap-1.5">
        ${regions.map(r => `<button data-region="${r}" type="button"
          class="px-2.5 py-1 rounded-full text-xs font-medium border transition-colors
            ${state.region === r ? 'bg-primary-800 border-primary-800 text-white' : 'bg-white border-neutral-200 text-neutral-600 hover:border-primary-300'}">${r}</button>`).join('')}
      </div>
    </div>`;
  }

  // ABV 범위
  html += `<div class="pt-4 border-t border-neutral-100">
    <h3 class="text-sm font-bold text-neutral-900 mb-2">도수 (ABV)</h3>
    <div class="range-wrap">
      <div class="absolute inset-x-0 h-1.5 bg-neutral-200 rounded-full"></div>
      <div data-fill="abv" class="absolute h-1.5 bg-primary-500 rounded-full"></div>
      <input data-range="abvMin" type="range" class="range-dual" min="0" max="100" step="1" value="${state.abvMin}">
      <input data-range="abvMax" type="range" class="range-dual" min="0" max="100" step="1" value="${state.abvMax}">
    </div>
    <div class="flex justify-between text-xs text-neutral-500 mt-1">
      <span data-label="abvMin">${state.abvMin}%</span><span data-label="abvMax">${state.abvMax}%</span>
    </div>
  </div>`;

  // 평점 범위
  html += `<div class="pt-4 border-t border-neutral-100">
    <h3 class="text-sm font-bold text-neutral-900 mb-2">평점</h3>
    <div class="range-wrap">
      <div class="absolute inset-x-0 h-1.5 bg-neutral-200 rounded-full"></div>
      <div data-fill="score" class="absolute h-1.5 bg-primary-500 rounded-full"></div>
      <input data-range="scoreMin" type="range" class="range-dual" min="0" max="100" step="1" value="${state.scoreMin}">
      <input data-range="scoreMax" type="range" class="range-dual" min="0" max="100" step="1" value="${state.scoreMax}">
    </div>
    <div class="flex justify-between text-xs text-neutral-500 mt-1">
      <span data-label="scoreMin">${state.scoreMin}</span><span data-label="scoreMax">${state.scoreMax}</span>
    </div>
  </div>`;

  // 초기화
  html += `<div class="pt-4 border-t border-neutral-100">
    <button data-reset type="button"
      class="w-full py-2.5 rounded-xl border border-neutral-200 text-sm font-semibold text-neutral-600 hover:bg-neutral-50 hover:text-danger-600 hover:border-danger-200">
      필터 초기화
    </button>
  </div>`;

  document.getElementById('desktopFilter').innerHTML = html;
  document.getElementById('mobileFilter').innerHTML = html;
  syncRangeFills();
}

/* ════════════════════════ 활성 필터 칩 ════════════════════════ */
function renderActiveChips() {
  const chips = [];
  if (state.category) chips.push({ label: CATEGORY_LABEL[state.category], onRemove: () => { state.category = null; state.expandedCategory = null; clearSubTypes(); state.region = null; } });
  for (const [cat, field] of Object.entries(SUB_FIELD)) {
    for (const code of state[field]) {
      const sub = CATEGORIES[cat].subs.find(s => s[0] === code);
      chips.push({ label: sub ? sub[1] : code, onRemove: () => { state[field] = state[field].filter(c => c !== code); } });
    }
  }
  if (state.country) chips.push({ label: state.country, onRemove: () => { state.country = null; state.region = null; } });
  if (state.region) chips.push({ label: state.region, onRemove: () => { state.region = null; } });
  if (state.abvMin > 0 || state.abvMax < 100) chips.push({ label: `도수 ${state.abvMin}~${state.abvMax}%`, onRemove: () => { state.abvMin = 0; state.abvMax = 100; } });
  if (state.scoreMin > 0 || state.scoreMax < 100) chips.push({ label: `평점 ${state.scoreMin}~${state.scoreMax}`, onRemove: () => { state.scoreMin = 0; state.scoreMax = 100; } });

  const wrap = document.getElementById('activeChipsWrap');
  const container = document.getElementById('activeChips');
  if (chips.length === 0) {
    wrap.classList.add('hidden');
    container.innerHTML = '';
    return;
  }
  wrap.classList.remove('hidden');
  container.innerHTML = chips.map((c, i) => `
    <span class="inline-flex items-center gap-1 pl-2.5 pr-1.5 py-1 rounded-full bg-white border border-neutral-200 text-xs font-medium text-neutral-700">
      ${c.label}
      <button data-chip-index="${i}" type="button" class="w-4 h-4 rounded-full flex items-center justify-center hover:bg-neutral-100 text-neutral-400">
        <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </span>`).join('');
  container.querySelectorAll('[data-chip-index]').forEach(btn => {
    btn.addEventListener('click', () => {
      chips[Number(btn.dataset.chipIndex)].onRemove();
      renderAll();
    });
  });
}

function clearSubTypes() {
  state.whiskyStyles = []; state.wineTypes = []; state.cognacGrades = [];
}

/* ════════════════════════ 필터링 + 정렬 ════════════════════════ */
function getFiltered() {
  let list = SPIRITS.filter(s => {
    if (state.category && s.category !== state.category) return false;
    if (state.category && SUB_FIELD[state.category]) {
      const field = SUB_FIELD[state.category];
      const subKey = CATEGORIES[state.category].subKey;
      if (state[field].length && !state[field].includes(s[subKey])) return false;
    }
    if (state.country && s.country !== state.country) return false;
    if (state.region && s.region !== state.region) return false;
    if (s.abv < state.abvMin || s.abv > state.abvMax) return false;
    if (s.avgScore < state.scoreMin || s.avgScore > state.scoreMax) return false;
    return true;
  });

  if (state.sort === 'SCORE_DESC') list = [...list].sort((a, b) => b.avgScore - a.avgScore);
  else if (state.sort === 'REVIEW_COUNT_DESC') list = [...list].sort((a, b) => b.reviewCount - a.reviewCount);
  else list = [...list].sort((a, b) => b.id - a.id); // LATEST: id desc 가정

  return list;
}

/* ════════════════════════ 그리드 렌더 ════════════════════════ */
function renderGrid() {
  const list = getFiltered();
  document.getElementById('resultCount').textContent = list.length;
  document.getElementById('applyCount').textContent = list.length;

  const grid = document.getElementById('grid');
  const empty = document.getElementById('emptyState');

  if (list.length === 0) {
    grid.innerHTML = '';
    grid.classList.add('hidden');
    empty.classList.remove('hidden');
    empty.classList.add('flex');
    return;
  }
  grid.classList.remove('hidden');
  empty.classList.add('hidden');
  empty.classList.remove('flex');

  grid.innerHTML = list.map(s => {
    const img = placeholderImg(s.bg, s.nameEn.split(' ')[0]);
    const big = placeholderImg(s.bg, s.nameEn.split(' ')[0], 900, 1200);
    return `
    <article class="group bg-white rounded-2xl shadow-sm overflow-hidden cursor-pointer
        transition-all duration-300 ease-out hover:shadow-xl hover:-translate-y-1">
      <div class="relative aspect-[3/4] overflow-hidden bg-neutral-100" data-zoom="${big}" data-zoom-name="${s.nameKo} (${s.nameEn})">
        <img src="${img}" alt="${s.nameKo}" loading="lazy"
          class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" />

        <!-- 카테고리 오버레이 -->
        <div class="absolute top-2 left-2">
          <span class="px-2 py-0.5 rounded-md text-[11px] font-semibold bg-black/45 text-white backdrop-blur-sm">${CATEGORY_LABEL[s.category]}</span>
        </div>

        <div class="absolute inset-0 bg-black/0 group-hover:bg-black/15 transition-colors flex items-center justify-center">
          <div class="opacity-0 group-hover:opacity-100 transition-opacity w-9 h-9 rounded-full bg-white/90 flex items-center justify-center">
            <svg class="w-4 h-4 text-neutral-700" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/><path d="M11 8v6M8 11h6"/></svg>
          </div>
        </div>
      </div>

      <div class="px-2.5 py-2">
        <div class="flex items-start justify-between gap-1.5">
          <h3 class="text-sm font-semibold text-neutral-900 line-clamp-1 leading-tight min-w-0">${s.nameKo}</h3>
          <span class="flex-shrink-0 text-xs font-bold" style="color:${scoreColor(s.avgScore)}">★ ${s.avgScore.toFixed(1)}</span>
        </div>
        <p class="text-xs text-neutral-400 line-clamp-1 mb-1">${s.nameEn}</p>
        <div class="flex items-center justify-between text-xs text-neutral-500">
          <span class="line-clamp-1">${s.country} · ${s.abv}%</span>
          <span class="flex-shrink-0 text-neutral-400">리뷰 ${s.reviewCount.toLocaleString()}</span>
        </div>
      </div>
    </article>`;
  }).join('');

  grid.querySelectorAll('[data-zoom]').forEach(el => {
    el.addEventListener('click', () => openLightbox(el.dataset.zoom, el.dataset.zoomName));
  });
}

/* ════════════════════════ 라이트박스 ════════════════════════ */
function openLightbox(src, alt) {
  const lb = document.getElementById('lightbox');
  const img = document.getElementById('lightboxImg');
  img.src = src;
  img.alt = alt;
  document.getElementById('lightboxCaption').textContent = alt;
  lb.classList.remove('hidden-lb');
}
function closeLightbox() {
  document.getElementById('lightbox').classList.add('hidden-lb');
}
document.getElementById('lightboxClose').addEventListener('click', closeLightbox);
document.getElementById('lightbox').addEventListener('click', (e) => {
  if (e.target.id === 'lightbox') closeLightbox();
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeLightbox(); });

/* ════════════════════════ 듀얼 레인지 ════════════════════════ */
function syncRangeFills() {
  ['abv', 'score'].forEach(key => {
    const minEl = document.querySelectorAll(`[data-range="${key === 'abv' ? 'abvMin' : 'scoreMin'}"]`);
    const maxEl = document.querySelectorAll(`[data-range="${key === 'abv' ? 'abvMax' : 'scoreMax'}"]`);
    const minVal = key === 'abv' ? state.abvMin : state.scoreMin;
    const maxVal = key === 'abv' ? state.abvMax : state.scoreMax;
    document.querySelectorAll(`[data-fill="${key}"]`).forEach(fill => {
      fill.style.left = minVal + '%';
      fill.style.right = (100 - maxVal) + '%';
    });
    minEl.forEach(el => el.value = minVal);
    maxEl.forEach(el => el.value = maxVal);
    document.querySelectorAll(`[data-label="${key === 'abv' ? 'abvMin' : 'scoreMin'}"]`).forEach(l => l.textContent = key === 'abv' ? minVal + '%' : minVal);
    document.querySelectorAll(`[data-label="${key === 'abv' ? 'abvMax' : 'scoreMax'}"]`).forEach(l => l.textContent = key === 'abv' ? maxVal + '%' : maxVal);
  });
}

/* ════════════════════════ 이벤트 위임 ════════════════════════ */
document.addEventListener('click', (e) => {
  const cat = e.target.closest('[data-cat]');
  if (cat) {
    const code = cat.dataset.cat;
    if (state.category === code) {
      // 같은 카테고리 다시 클릭 → 아코디언만 토글
      state.expandedCategory = state.expandedCategory === code ? null : code;
    } else {
      state.category = code;
      state.expandedCategory = code;
      clearSubTypes();
      state.region = null;
    }
    renderAll();
    return;
  }

  const sub = e.target.closest('[data-sub]');
  if (sub) {
    const [cat, code] = sub.dataset.sub.split(':');
    const field = SUB_FIELD[cat];
    if (state[field].includes(code)) state[field] = state[field].filter(c => c !== code);
    else state[field].push(code);
    renderAll();
    return;
  }

  const country = e.target.closest('[data-country]');
  if (country) {
    const code = country.dataset.country;
    state.country = state.country === code ? null : code;
    state.region = null;
    renderAll();
    return;
  }

  const region = e.target.closest('[data-region]');
  if (region) {
    const code = region.dataset.region;
    state.region = state.region === code ? null : code;
    renderAll();
    return;
  }

  if (e.target.closest('[data-reset]')) {
    Object.assign(state, {
      category: null, whiskyStyles: [], wineTypes: [], cognacGrades: [],
      country: null, region: null, abvMin: 0, abvMax: 100, scoreMin: 0, scoreMax: 100,
      expandedCategory: null, countrySearch: '',
    });
    renderAll();
    return;
  }
});

document.addEventListener('input', (e) => {
  if (e.target.matches('[data-country-search]')) {
    state.countrySearch = e.target.value;
    renderFilterPanel();
    // 국가 검색 입력 포커스 유지
    const sel = e.target === document.activeElement ? e.target : null;
    return;
  }

  if (e.target.matches('[data-range]')) {
    const key = e.target.dataset.range;
    let val = Number(e.target.value);
    if (key === 'abvMin') state.abvMin = Math.min(val, state.abvMax);
    else if (key === 'abvMax') state.abvMax = Math.max(val, state.abvMin);
    else if (key === 'scoreMin') state.scoreMin = Math.min(val, state.scoreMax);
    else if (key === 'scoreMax') state.scoreMax = Math.max(val, state.scoreMin);
    syncRangeFills();
    renderGrid();
    renderActiveChips();
    return;
  }
});

document.getElementById('sortSelect').addEventListener('change', (e) => {
  state.sort = e.target.value;
  renderGrid();
});

/* ════════════════════════ 모바일 드로어 ════════════════════════ */
function openDrawer() {
  document.getElementById('mobileDrawer').classList.remove('-translate-x-full');
  document.getElementById('drawerBackdrop').classList.remove('opacity-0', 'pointer-events-none');
}
function closeDrawer() {
  document.getElementById('mobileDrawer').classList.add('-translate-x-full');
  document.getElementById('drawerBackdrop').classList.add('opacity-0', 'pointer-events-none');
}
document.getElementById('openDrawerBtn').addEventListener('click', openDrawer);
document.getElementById('closeDrawerBtn').addEventListener('click', closeDrawer);
document.getElementById('drawerBackdrop').addEventListener('click', closeDrawer);
document.getElementById('applyDrawerBtn').addEventListener('click', closeDrawer);

/* ════════════════════════ 활성 필터 개수(모바일 배지) ════════════════════════ */
function updateMobileBadge() {
  let count = 0;
  if (state.category) count++;
  count += state.whiskyStyles.length + state.wineTypes.length + state.cognacGrades.length;
  if (state.country) count++;
  if (state.region) count++;
  if (state.abvMin > 0 || state.abvMax < 100) count++;
  if (state.scoreMin > 0 || state.scoreMax < 100) count++;

  const badge = document.getElementById('mobileFilterCount');
  if (count > 0) {
    badge.textContent = count;
    badge.classList.remove('hidden');
  } else {
    badge.classList.add('hidden');
  }
}

/* ════════════════════════ 데스크톱 필터 패널 위치 동기화 ════════════════════════
   #desktopFilter 는 fixed 로 분리되어 본문/사이드바 스크롤이 서로 영향을 주지 않음.
   #filterSpacer 의 좌표만 따라가도록 left 값을 동기화. */
function positionFilterPanel() {
  const spacer = document.getElementById('filterSpacer');
  const panel = document.getElementById('desktopFilter');
  if (!spacer || !panel) return;
  const rect = spacer.getBoundingClientRect();
  panel.style.left = rect.left + 'px';
  panel.style.width = rect.width + 'px';
}
window.addEventListener('resize', positionFilterPanel);

/* ════════════════════════ 전체 렌더 ════════════════════════ */
function renderAll() {
  renderFilterPanel();
  renderActiveChips();
  renderGrid();
  updateMobileBadge();
  positionFilterPanel();
}

renderAll();
</script>
</body>
</html>
