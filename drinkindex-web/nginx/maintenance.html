<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>점검 중 — DrinkIndex</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --amber-50:  #fffbeb;
            --amber-100: #fef3c7;
            --amber-500: #f59e0b;
            --amber-600: #d97706;
            --amber-700: #b45309;
            --gray-700:  #374151;
            --gray-500:  #6b7280;
        }
        html, body {
            height: 100%;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI',
                         Roboto, 'Apple SD Gothic Neo', sans-serif;
            background: linear-gradient(135deg, var(--amber-50) 0%, #ffffff 100%);
            color: var(--gray-700);
        }
        .wrap {
            min-height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .card {
            max-width: 480px;
            width: 100%;
            text-align: center;
            padding: 48px 32px;
        }
        .icon {
            font-size: 64px;
            margin-bottom: 24px;
        }
        h1 {
            font-size: 28px;
            font-weight: 700;
            color: var(--amber-700);
            margin-bottom: 16px;
            letter-spacing: -0.02em;
        }
        .lede {
            font-size: 16px;
            line-height: 1.6;
            color: var(--gray-700);
            margin-bottom: 24px;
        }
        .sub {
            font-size: 14px;
            color: var(--gray-500);
            line-height: 1.6;
            padding: 16px;
            background: rgba(254, 243, 199, 0.5);
            border-radius: 12px;
            margin-bottom: 24px;
        }
        .footer {
            font-size: 12px;
            color: var(--gray-500);
            margin-top: 16px;
        }
        .brand {
            font-weight: 700;
            color: var(--amber-600);
        }
        @media (max-width: 480px) {
            .card { padding: 32px 20px; }
            h1 { font-size: 22px; }
            .icon { font-size: 48px; }
        }
    </style>
</head>
<body>
    <main class="wrap">
        <section class="card" role="alert" aria-live="polite">
            <div class="icon" aria-hidden="true">🔧</div>
            <h1>서비스 점검 중입니다</h1>
            <p class="lede">
                더 나은 서비스를 위해<br />
                잠시 점검을 진행하고 있습니다.
            </p>
            <p class="sub">
                점검이 완료되는 대로 정상 운영하겠습니다.<br />
                이용에 불편을 드려 죄송합니다.
            </p>
            <p class="footer">
                <span class="brand">DrinkIndex</span> — 위스키 · 꼬냑 · 와인 리뷰 커뮤니티
            </p>
        </section>
    </main>
</body>
</html>
