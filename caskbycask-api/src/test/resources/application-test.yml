spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  data:
    redis:
      host: localhost
      port: 6379

  # Flyway 는 H2 에서 비활성 (ddl-auto: create-drop 사용)
  flyway:
    enabled: false

upload:
  path: ./test-uploads

storage:
  local:
    base-path: ./test-uploads

admin:
  seed:
    email: test-admin@example.com
    password: TestAdminPass123!
    nickname: 관리자

app:
  email:
    inquiry-to: test-inquiry@example.com

cors:
  allowed-origins: "http://localhost:5173"

jwt:
  secret: test-secret-key-must-be-at-least-32-characters-long
  access-token-expiry: 3600000
  refresh-token-expiry: 604800000

# Bucket4j Redis 연결 시도 회피 — 테스트에서는 rate limit 검증 안 함
rate-limit:
  enabled: false

# Actuator 관리 포트 분리 비활성 — 테스트는 단일 포트
management:
  server:
    port: -1
  endpoints:
    web:
      exposure:
        include: health
