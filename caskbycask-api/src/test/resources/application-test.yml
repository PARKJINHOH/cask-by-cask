spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        search:
          automatic_indexing:
            synchronization:
              strategy: sync

  data:
    redis:
      host: localhost
      port: 6379

  # Flyway 는 H2 에서 비활성 (ddl-auto: create-drop 사용)
  flyway:
    enabled: false

upload:
  path: ./test-uploads

storage:
  local:
    base-path: ./test-uploads

admin:
  seed:
    email: test-admin@example.com
    password: TestAdminPass123!
    nickname: 관리자

app:
  email:
    inquiry-to: test-inquiry@example.com

cors:
  allowed-origins: "http://localhost:5173"

jwt:
  secret: test-secret-key-must-be-at-least-32-characters-long
  access-token-expiry: 3600000
  refresh-token-expiry: 604800000

# 소셜 로그인 — 테스트용 더미 키 (Base64 32바이트). 실제 제공자 호출은 테스트에서 발생하지 않음.
oauth:
  token-encryption-key: dGVzdC1vYXV0aC1lbmNyeXB0aW9uLWtleS0zMmJ5dGU=
  allowed-redirect-uris: "http://localhost:5173/oauth/callback"
  naver:
    client-id: ""
    client-secret: ""
  google:
    client-id: ""
    client-secret: ""

# Bucket4j Redis 연결 시도 회피 — 테스트에서는 rate limit 검증 안 함
rate-limit:
  enabled: false

# Actuator 관리 포트 분리 비활성 — 테스트는 단일 포트
management:
  server:
    port: -1
  endpoints:
    web:
      exposure:
        include: health
