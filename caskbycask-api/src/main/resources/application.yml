spring:
  application:
    name: caskbycask-api
  profiles:
    active: local

  jackson:
    serialization:
      write-dates-as-timestamps: false

  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        search:
          backend:
            type: lucene
            directory:
              type: local-filesystem
              root: ${HIBERNATE_SEARCH_INDEX_PATH:./lucene/indexes}
            analysis:
              configurer: class:com.caskbycask.global.config.search.CustomLuceneAnalysisConfigurer

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    baseline-description: "init baseline"
    locations: classpath:db/migration
    validate-on-migrate: true

  data:
    redis:
      timeout: 2000ms

  servlet:
    multipart:
      max-file-size: 51MB        # 동영상 50MB + 여유
      max-request-size: 52MB

jwt:
  secret: ${JWT_SECRET}
  # 키 회전 중에만 설정 — 신규 키를 JWT_SECRET 로 옮길 때 기존 키를 여기에 두어
  # Refresh Token TTL(7일) 동안 무중단 회전 가능.
  secret-previous: ${JWT_SECRET_PREVIOUS:}
  access-token-expiry: 3600000      # 1h  (ms)
  refresh-token-expiry: 604800000   # 7d  (ms)

# 소셜 로그인(OAuth2) — 커스텀 REST 코드교환 방식.
# client secret/암호화 키는 서버에만 둔다. redirect-uri 는 프론트 콜백 URL 화이트리스트.
oauth:
  # 제공자 refresh token 암호화 키 (Base64, 32바이트). 분실 시 기존 연동 토큰 복호화 불가 → 연동해지만 영향.
  token-encryption-key: ${OAUTH_TOKEN_ENCRYPTION_KEY}
  # 프론트 콜백 URL 화이트리스트 (콤마 구분). 기본값은 local 개발용.
  allowed-redirect-uris: ${OAUTH_ALLOWED_REDIRECT_URIS:http://localhost:5173/oauth/callback}
  naver:
    client-id: ${OAUTH_NAVER_CLIENT_ID:}
    client-secret: ${OAUTH_NAVER_CLIENT_SECRET:}
  google:
    client-id: ${OAUTH_GOOGLE_CLIENT_ID:}
    client-secret: ${OAUTH_GOOGLE_CLIENT_SECRET:}

upload:
  path: ${UPLOAD_PATH:./uploads}

storage:
  local:
    # upload.path 와 동일한 루트를 사용 (prod 는 UPLOAD_PATH=/app/upload 로 영속 디스크).
    # 이렇게 해야 LocalFileStorageService 가 저장한 /api/{domain}/images 파일과
    # nginx 가 /uploads 로 서빙하는 파일이 같은 디렉터리 트리에 놓인다.
    base-path: ${UPLOAD_PATH:./uploads}

search:
  mass-index-on-startup:
    # 현재는 데이터 정합성을 위해 매 기동 시 실행한다. 운영 측정 없이 높이지 않는다.
    threads-to-load-objects: ${HIBERNATE_SEARCH_MASS_INDEX_THREADS:4}

admin:
  seed:
    email: ${ADMIN_EMAIL}
    password: ${ADMIN_PASSWORD}
    nickname: 관리자

app:
  email:
    provider: smtp
    from: drinkindex.cs@gmail.com
    verification-required: true
    inquiry-to: drinkindex.cs@gmail.com
  auth:
    # Refresh Token httpOnly 쿠키 설정 — 기본값은 local(http) 기준.
    # dev/prod 에서는 secure=true, same-site=Strict 로 override.
    refresh-cookie:
      name: refresh_token
      secure: false
      same-site: Lax
      path: /api/auth

decorator:
  datasource:
    enabled: false

caskbycask:
  # 크롤러(caskbycask-crawler) 내부 수신 API(/api/internal/**) 인증 키.
  # 크롤러 .env 의 CASKBYCASK_INTERNAL_KEY 와 동일해야 함. 미설정 시 내부 API 는 전부 401.
  internal-api-key: ${CASKBYCASK_INTERNAL_KEY:}

rate-limit:
  enabled: true

# 해외·면세 가격 자동 원화 환산. 공개 API 장애 시 DB의 마지막 정상 환율을 계속 사용한다.
exchange-rate:
  provider-url: ${EXCHANGE_RATE_PROVIDER_URL:https://api.frankfurter.dev}
  refresh-cron: ${EXCHANGE_RATE_REFRESH_CRON:0 5 0,6,12,18 * * *}
  connect-timeout-ms: ${EXCHANGE_RATE_CONNECT_TIMEOUT_MS:3000}
  read-timeout-ms: ${EXCHANGE_RATE_READ_TIMEOUT_MS:15000}
  retry-max-attempts: ${EXCHANGE_RATE_RETRY_MAX_ATTEMPTS:3}
  retry-initial-backoff-ms: ${EXCHANGE_RATE_RETRY_INITIAL_BACKOFF_MS:1000}

# SEO 메타 — sitemap.xml / IndexNow 의 base URL
# (페이지 HTML 은 Next.js 가 렌더링한다. API 는 sitemap·IndexNow·SEO 조회 API 만 담당)
seo:
  site-url: ${SEO_SITE_URL:https://www.caskbycask.net}
  index-now:
    enabled: ${INDEXNOW_ENABLED:false}
    key: ${INDEXNOW_KEY:}
    endpoint: ${INDEXNOW_ENDPOINT:https://searchadvisor.naver.com/indexnow}

# 공식 Instagram / Threads 게시 연동. 운영 연결과 검증 전에는 반드시 false로 유지한다.
social-publishing:
  enabled: ${SOCIAL_PUBLISH_ENABLED:false}
  site-url: ${SEO_SITE_URL:https://www.caskbycask.net}
  public-media-base-url: ${SOCIAL_PUBLIC_MEDIA_BASE_URL:${SEO_SITE_URL:https://www.caskbycask.net}}
  oauth-redirect-uri: ${SOCIAL_OAUTH_REDIRECT_URI:http://localhost:8080/api/admin/social/accounts/oauth/callback}
  token-encryption-key: ${SOCIAL_TOKEN_ENCRYPTION_KEY:}
  connect-timeout: ${SOCIAL_HTTP_CONNECT_TIMEOUT:5s}
  read-timeout: ${SOCIAL_HTTP_READ_TIMEOUT:20s}
  instagram:
    app-id: ${SOCIAL_INSTAGRAM_APP_ID:}
    app-secret: ${SOCIAL_INSTAGRAM_APP_SECRET:}
    authorization-url: ${SOCIAL_INSTAGRAM_AUTHORIZATION_URL:https://www.instagram.com/oauth/authorize}
    oauth-api-base-url: ${SOCIAL_INSTAGRAM_OAUTH_API_BASE_URL:https://api.instagram.com}
    token-api-base-url: ${SOCIAL_INSTAGRAM_TOKEN_API_BASE_URL:https://graph.instagram.com}
    api-base-url: ${SOCIAL_INSTAGRAM_API_BASE_URL:https://graph.instagram.com/v25.0}
    scopes: instagram_business_basic,instagram_business_content_publish
  threads:
    app-id: ${SOCIAL_THREADS_APP_ID:}
    app-secret: ${SOCIAL_THREADS_APP_SECRET:}
    authorization-url: ${SOCIAL_THREADS_AUTHORIZATION_URL:https://threads.net/oauth/authorize}
    oauth-api-base-url: ${SOCIAL_THREADS_OAUTH_API_BASE_URL:https://graph.threads.net}
    token-api-base-url: ${SOCIAL_THREADS_TOKEN_API_BASE_URL:https://graph.threads.net}
    api-base-url: ${SOCIAL_THREADS_API_BASE_URL:https://graph.threads.net}
    scopes: threads_basic,threads_content_publish

# Actuator: Prometheus/Health 만 노출
# server.port / server.address 는 프로파일별로 설정 (local: 메인과 동일 포트 / dev,prod: 별도 포트 + localhost 바인딩)
management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: prometheus,health,info
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
      group:
        readiness:
          # 재색인 실패 시 API 프로세스는 유지하되 배포 readiness는 실패시킨다.
          include: readinessState,searchIndex
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true
