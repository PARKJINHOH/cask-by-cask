spring:
  application:
    name: caskbycask-api
  profiles:
    active: local

  jackson:
    serialization:
      write-dates-as-timestamps: false

  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    baseline-description: "init baseline"
    locations: classpath:db/migration
    validate-on-migrate: true

  data:
    redis:
      timeout: 2000ms

  servlet:
    multipart:
      max-file-size: 51MB        # 동영상 50MB + 여유
      max-request-size: 52MB

jwt:
  secret: ${JWT_SECRET}
  # 키 회전 중에만 설정 — 신규 키를 JWT_SECRET 로 옮길 때 기존 키를 여기에 두어
  # Refresh Token TTL(7일) 동안 무중단 회전 가능.
  secret-previous: ${JWT_SECRET_PREVIOUS:}
  access-token-expiry: 3600000      # 1h  (ms)
  refresh-token-expiry: 604800000   # 7d  (ms)

upload:
  path: ./uploads

storage:
  local:
    base-path: ./uploads

admin:
  seed:
    email: ${ADMIN_EMAIL}
    password: ${ADMIN_PASSWORD}
    nickname: 관리자

app:
  email:
    provider: smtp
    from: caskbycask.cs@gmail.com
    verification-required: true
    inquiry-to: caskbycask.cs@gmail.com
  auth:
    # Refresh Token httpOnly 쿠키 설정 — 기본값은 local(http) 기준.
    # dev/prod 에서는 secure=true, same-site=Strict 로 override.
    refresh-cookie:
      name: refresh_token
      secure: false
      same-site: Lax
      path: /api/auth

decorator:
  datasource:
    enabled: false

caskbycask:
  # 크롤러(caskbycask-crawler) 내부 수신 API(/api/internal/**) 인증 키.
  # 크롤러 .env 의 CASKBYCASK_INTERNAL_KEY 와 동일해야 함. 미설정 시 내부 API 는 전부 401.
  internal-api-key: ${CASKBYCASK_INTERNAL_KEY:}

rate-limit:
  enabled: true

# SEO 메타 — sitemap.xml 의 base URL
seo:
  site-url: https://caskbycask.pinner.dev

# Actuator: Prometheus/Health 만 노출
# server.port / server.address 는 프로파일별로 설정 (local: 메인과 동일 포트 / dev,prod: 별도 포트 + localhost 바인딩)
management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: prometheus,health,info
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true
