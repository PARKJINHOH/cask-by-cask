spring:
  datasource:
    url: jdbc:mariadb://${DB_HOST}:3306/caskbycask_prod?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Seoul
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false

  data:
    redis:
      host: ${REDIS_HOST}
      port: 6379
      password: ${REDIS_PASSWORD}

  mail:
    host: smtp.gmail.com
    port: 587
    username: caskbycask.cs@gmail.com
    password: ${GMAIL_APP_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true

app:
  email:
    from: caskbycask.cs@gmail.com
  auth:
    refresh-cookie:
      secure: true
      same-site: Strict

cors:
  allowed-origins: https://caskbycask.net

seo:
  site-url: https://caskbycask.net

logging:
  file:
    path: ./logs
  level:
    root: WARN
    com.caskbycask: INFO

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

slack:
  webhook-url: ${SLACK_WEBHOOK_URL}
  channel: ${SLACK_CHANNEL:#caskbycask-alerts}

# Actuator 를 별도 포트로 분리 + localhost 바인딩 (docker network 내부만)
management:
  server:
    port: 8081
    address: 127.0.0.1