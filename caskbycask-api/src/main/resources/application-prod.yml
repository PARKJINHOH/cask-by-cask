spring:
  datasource:
    url: jdbc:mariadb://${DB_HOST}:3306/caskbycask_prod?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Seoul
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false

  data:
    redis:
      host: ${REDIS_HOST}
      port: 6379
      password: ${REDIS_PASSWORD}

  mail:
    host: smtp.gmail.com
    port: 587
    username: drinkindex.cs@gmail.com
    password: ${GMAIL_APP_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true

app:
  email:
    from: drinkindex.cs@gmail.com
  auth:
    refresh-cookie:
      secure: true
      same-site: Strict

cors:
  allowed-origins: https://www.caskbycask.net

seo:
  site-url: https://www.caskbycask.net
  index-path: /app/vite/dist/index.html

logging:
  file:
    path: ./logs
  level:
    root: WARN
    com.caskbycask: INFO
    # Never log SQL bind values in production. They may contain credentials or personal data.
    com.caskbycask.global.logging.SqlQueryLoggingListener: "OFF"

decorator:
  datasource:
    # Query interception is for local diagnostics only; it adds work to every production query.
    enabled: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

slack:
  webhook-url: ${SLACK_WEBHOOK_URL}
  channel: ${SLACK_CHANNEL:#caskbycask-alerts}

# Actuator 를 별도 포트(8081)로 분리 + localhost 바인딩 (외부 비노출, nginx 에서 /actuator 차단)
management:
  server:
    port: 8081
    address: 127.0.0.1
