spring:
  datasource:
    url: jdbc:mariadb://${PROD_DB_HOST}:3306/drinkindex_prod?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Seoul
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  data:
    redis:
      host: ${PROD_REDIS_HOST}
      port: 6379

logging:
  level:
    root: WARN
    com.drinkindex: WARN
