spring:
  datasource:
    url: jdbc:mariadb://${DEV_DB_HOST}:13306/drinkindex_dev?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Seoul
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: ${DEV_REDIS_HOST}
      port: 16379
      password: ${DEV_REDIS_PASSWORD}

upload:
  path: ${user.home}/drinkindex-uploads

cors:
  allowed-origins: "http://localhost:5173,http://localhost:3000"

logging:
  level:
    com.drinkindex: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
