spring:
  datasource:
    url: jdbc:mariadb://${DEV_DB_HOST}:3306/drinkindex_local?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Seoul
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: false

  flyway:
    enabled: false

  data:
    redis:
      host: ${DEV_REDIS_HOST}
      port: 6379
      password: ${DEV_REDIS_PASSWORD}

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_USERNAME}
    password: ${GMAIL_APP_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true

upload:
  path: ${UPLOAD_PATH:${user.home}/drinkindex-uploads}

storage:
  local:
    base-path: ${UPLOAD_PATH:${user.home}/drinkindex-uploads}

cors:
  allowed-origins: "http://localhost:5173,http://localhost:3000"

logging:
  level:
    com.drinkindex: DEBUG

decorator:
  datasource:
    enabled: true

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

# 로컬 개발 편의를 위해 rate limit 비활성화 (Redis 없이도 동작 가능)
rate-limit:
  enabled: false

# 로컬: 메인 포트(8080)에서 actuator 함께 노출 — server 섹션 자체를 비워둠
# (base 에 management.server 가 없으므로 별도 override 불필요)
