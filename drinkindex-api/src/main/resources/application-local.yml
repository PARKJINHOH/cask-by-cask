spring:
  datasource:
    url: jdbc:mariadb://${DEV_DB_HOST}:13306/drinkindex_dev?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Seoul
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: ${DEV_REDIS_HOST}
      port: 16379
      password: ${DEV_REDIS_PASSWORD}

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_USERNAME}
    password: ${GMAIL_APP_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true

upload:
  path: ${user.home}/drinkindex-uploads

storage:
  local:
    base-path: ${user.home}/drinkindex-uploads

cors:
  allowed-origins: "http://localhost:5173,http://localhost:3000"

logging:
  level:
    com.drinkindex: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
