spring:
  datasource:
    url: jdbc:mariadb://${DEV_DB_HOST}:3306/drinkindex_dev?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Seoul
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  data:
    redis:
      host: ${DEV_REDIS_HOST}
      port: 6379
      password: ${DEV_REDIS_PASSWORD}

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_USERNAME}
    password: ${GMAIL_APP_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true

storage:
  s3:
    bucket: TODO
    region: TODO
    access-key: TODO
    secret-key: TODO

cors:
  allowed-origins: https://drinkindex.ptory.net

logging:
  level:
    com.drinkindex: INFO

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true