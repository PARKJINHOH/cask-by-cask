spring:
  datasource:
    url: jdbc:mariadb://${DEV_DB_HOST}:3306/drinkindex_dev?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Seoul
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  data:
    redis:
      host: ${DEV_REDIS_HOST}
      port: 6379
      password: ${DEV_REDIS_PASSWORD}

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_USERNAME}
    password: ${GMAIL_APP_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true

cors:
  allowed-origins: https://drinkindex.ptory.net

logging:
  file:
    path: ${LOG_PATH:/var/drinkindex/logs/dev}
  level:
    com.drinkindex: INFO

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

# Actuator 를 별도 포트로 분리 + localhost 바인딩 (docker network 내부만)
management:
  server:
    port: 8081
    address: ${MANAGEMENT_HOST:127.0.0.1}