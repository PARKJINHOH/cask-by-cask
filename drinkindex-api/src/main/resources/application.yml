spring:
  profiles:
    active: local

  jackson:
    serialization:
      write-dates-as-timestamps: false

  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  data:
    redis:
      timeout: 2000ms

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

jwt:
  secret: ${JWT_SECRET}
  access-token-expiry: 3600000      # 1h  (ms)
  refresh-token-expiry: 604800000   # 7d  (ms)

upload:
  path: ${UPLOAD_PATH:./uploads}

admin:
  seed:
    email: ${ADMIN_EMAIL}
    password: ${ADMIN_PASSWORD}
    nickname: 관리자

app:
  email:
    provider: smtp
    from: ${EMAIL_FROM:noreply@drinkindex.com}
    verification-required: true
